<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importer vers Comparateur</title><style>body{font-family:system-ui;background:#0f1115;color:#fff;padding:24px}.card{max-width:760px;margin:18px auto;background:#171a21;padding:20px;border-radius:14px}a{display:inline-block;background:#c0392b;color:#fff;text-decoration:none;font-weight:800;padding:14px 18px;border-radius:10px}</style></head><body><div class="card"><h1>Import direct UTMB / GoTiming</h1><p>Ajoute ce bouton à tes favoris :</p><a href="javascript:(async()=&gt;{const TARGET=&#x27;https://shurikn57.github.io/10km-FFA/&#x27;;const C=s=&gt;(s||&#x27;&#x27;).replace(/\s+/g,&#x27; &#x27;).trim(),tm=s=&gt;/\b(?:\d{1,2}:)?\d{1,2}:\d{2}\b/.test(C(s)),rk=s=&gt;/^\d{1,5}$/.test(C(s)),uq=a=&gt;{const m=new Map;for(const x of a){const k=[x.rank,x.name,x.time].join(&#x27;|&#x27;);if(x.name&amp;&amp;!m.has(k))m.set(k,x)}return[...m.values()]};function send(runners,source){runners=uq(runners);if(!runners.length)return alert(&#x27;Aucun participant reconnu.&#x27;);const p={type:&#x27;COMPARATEUR_10K_IMPORT&#x27;,source,runners},w=window.open(TARGET+&#x27;?webimport=1&#x27;,&#x27;comparateur10k&#x27;);if(!w)return alert(&#x27;Safari a bloqué l’ouverture du comparateur.&#x27;);let n=0;const it=setInterval(()=&gt;{try{w.postMessage(p,&#x27;*&#x27;)}catch(e){}if(++n&gt;20)clearInterval(it)},500);window.addEventListener(&#x27;message&#x27;,function a(e){if(e.data&amp;&amp;e.data.type===&#x27;COMPARATEUR_10K_ACK&#x27;){clearInterval(it);window.removeEventListener(&#x27;message&#x27;,a)}},false)}function parseU(doc){const o=[];for(const a of doc.querySelectorAll(&#x27;a[href*=&quot;/runner/&quot;]&#x27;)){const name=C(a.textContent);let b=a;for(let i=0;i&lt;8&amp;&amp;b;i++,b=b.parentElement){const t=C(b.innerText),m=t.match(/\b(\d{1,5})\s+(\d{1,2}:\d{2}:\d{2})\b/);if(m){o.push({rank:m[1],time:m[2],name,sex:/Femme/i.test(t)?&#x27;F&#x27;:/Homme/i.test(t)?&#x27;M&#x27;:&#x27;&#x27;,category:(t.match(/\b(\d{2}-\d{2}|80\+)\b/)||[])[1]||&#x27;&#x27;,profile_url:new URL(a.getAttribute(&#x27;href&#x27;),location.origin).href});break}}}return uq(o)}async function utmb(){const base=new URL(location.href);base.searchParams.delete(&#x27;page&#x27;);let max=1;for(const a of document.querySelectorAll(&#x27;a[href*=&quot;page=&quot;]&#x27;)){try{max=Math.max(max,+(new URL(a.href,location.href).searchParams.get(&#x27;page&#x27;)||1))}catch(e){}}const m=C(document.body.innerText).match(/(\d+)\s+R[ée]sultats/i);if(m&amp;&amp;max===1)max=Math.ceil(+m[1]/25);const all=[];for(let p=1;p&lt;=max;p++){let d;if(p===+(new URL(location.href).searchParams.get(&#x27;page&#x27;)||1))d=document;else{const u=new URL(base.href);if(p&gt;1)u.searchParams.set(&#x27;page&#x27;,p);const t=await fetch(u.href,{credentials:&#x27;include&#x27;}).then(r=&gt;r.text());d=new DOMParser().parseFromString(t,&#x27;text/html&#x27;)}all.push(...parseU(d))}send(all,&#x27;UTMB&#x27;)}function parseG(doc){const o=[];for(const tr of doc.querySelectorAll(&#x27;tr,[role=&quot;row&quot;]&#x27;)){const c=[...tr.querySelectorAll(&#x27;td,[role=&quot;cell&quot;],[role=&quot;gridcell&quot;]&#x27;)].map(x=&gt;C(x.innerText||x.textContent)).filter(Boolean);if(c.length&lt;3)continue;const ri=c.findIndex(rk),ti=c.findIndex(tm);if(ri&lt;0||ti&lt;0)continue;let ni=-1;for(let i=0;i&lt;c.length;i++)if(i!==ri&amp;&amp;i!==ti&amp;&amp;/[A-Za-zÀ-ÿ]{2,}/.test(c[i])&amp;&amp;!/^(M|F|H|Homme|Femme)$/i.test(c[i])){ni=i;break}if(ni&gt;=0)o.push({rank:c[ri],time:(c[ti].match(/(?:\d{1,2}:)?\d{1,2}:\d{2}/)||[])[0]||c[ti],name:c[ni],sex:&#x27;&#x27;,category:&#x27;&#x27;,profile_url:&#x27;&#x27;})}return uq(o)}async function go(){let o=parseG(document);if(!o.length){const a=(document.body.innerText||&#x27;&#x27;).split(/\n+/).map(C).filter(Boolean);for(let i=0;i&lt;a.length-2;i++)if(rk(a[i])&amp;&amp;tm(a[i+1])&amp;&amp;/[A-Za-zÀ-ÿ]{2,}/.test(a[i+2]))o.push({rank:a[i],time:a[i+1],name:a[i+2],sex:&#x27;&#x27;,category:&#x27;&#x27;,profile_url:&#x27;&#x27;})}send(o,&#x27;GoTiming&#x27;)}const h=location.hostname.toLowerCase();if(h.includes(&#x27;utmb.world&#x27;))await utmb();else if(h.includes(&#x27;gotiming.fr&#x27;))await go();else alert(&#x27;Site non reconnu : ouvre UTMB ou GoTiming.&#x27;)})().catch(e=&gt;alert(&#x27;Import vers Comparateur : &#x27;+e.message))">Importer vers Comparateur</a><p>Un seul favori détecte automatiquement UTMB ou GoTiming et ouvre ensuite le comparateur.</p></div></body></html>
