<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Comparateur 10K">
<link rel="manifest" href="./manifest.webmanifest">
<title>Comparateur 10 km — mobile</title>
<script src="./core.js"></script>
<style>
:root {
  --bg:#0f1115; --panel:#171a21; --panel2:#20242d; --text:#f3f5f7;
  --muted:#9aa4b2; --line:#303744; --good:#69d39b; --warn:#ffc857; --bad:#ff7a7a;
  --accent:#71a7ff;
}
* { box-sizing:border-box }
html { -webkit-text-size-adjust:100%; }
body {
  margin:0; font-family:Inter,system-ui,Segoe UI,Arial,sans-serif; background:var(--bg); color:var(--text);
  padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right);
  padding-bottom:calc(18px + env(safe-area-inset-bottom));
}
.wrap { max-width:640px; margin:0 auto; padding:14px; padding-top:calc(14px + env(safe-area-inset-top)); }
h1 { font-size:19px; margin:0 0 4px }
.sub { color:var(--muted); font-size:12px; margin-bottom:14px }
.card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px; }
button {
  border:1px solid var(--line); background:var(--panel2); color:var(--text);
  border-radius:10px; padding:13px 12px; cursor:pointer; font-weight:700; font-size:15px;
  touch-action:manipulation;
}
button.primary { background:#2458a6; border-color:#3973cf }
button.paste { background:#1f5c3f; border-color:#2c7a54 }
button:disabled { opacity:.5; cursor:not-allowed }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-top:10px }
.toolbar > * { flex:1; min-width:0 }
textarea {
  width:100%; min-height:90px; resize:vertical; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); border-radius:10px; padding:10px; font-size:16px;
}
input[type=search] {
  width:100%; padding:12px; border-radius:10px; border:1px solid var(--line);
  background:var(--panel2); color:var(--text); font-size:16px; margin-bottom:10px;
}
.msg { margin-top:8px; color:var(--muted); font-size:12px; min-height:16px; line-height:1.4 }
.stats { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-bottom:10px }
.stat { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px }
.stat .n { font-size:22px; font-weight:800 }
.stat .l { color:var(--muted); font-size:11px }
.tablewrap { overflow:hidden; border:1px solid var(--line); border-radius:10px; }
table { width:100%; border-collapse:collapse; table-layout:fixed }
th,td { padding:9px 8px; border-bottom:1px solid var(--line); text-align:left; font-size:12px; vertical-align:top }
th { position:sticky; top:0; background:#151922; z-index:2; color:#c8d0dc }
th:nth-child(1),td:nth-child(1) { width:54% }
th:nth-child(2),td:nth-child(2) { width:23% }
th:nth-child(3),td:nth-child(3) { width:23% }
.runner-name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block; }
tr:hover td { background:#181d26 }
.badge { display:inline-block; padding:3px 7px; border-radius:999px; font-size:10px; font-weight:700; margin-top:3px }
.ok { color:var(--good); background:#163427 }
.warn { color:var(--warn); background:#3b3012 }
.no { color:var(--bad); background:#3a1d1d }
.small { color:var(--muted); font-size:12px }
</style>
</head>
<body>
<div class="wrap">
  <h1>Comparateur 10 km</h1>
  <div class="sub" id="baseStatus">Chargement de la base FFA…</div>

  <div class="card">
    <button class="paste" id="pasteBtn" style="width:100%">📋 Coller le classement</button>
    <textarea id="paste" placeholder="…ou colle ici manuellement (appui long → Coller)" style="margin-top:10px"></textarea>
    <div class="toolbar">
      <button id="clearRace">Effacer</button>
    </div>
    <div id="raceMsg" class="msg"></div>
  </div>

  <div class="stats">
    <div class="stat"><div class="n" id="sTotal">0</div><div class="l">Participants</div></div>
    <div class="stat"><div class="n" id="sExact">0</div><div class="l">Matchs exacts</div></div>
    <div class="stat"><div class="n" id="sAmb">0</div><div class="l">Ambigus</div></div>
    <div class="stat"><div class="n" id="sNone">0</div><div class="l">Non trouvés</div></div>
  </div>

  <input id="search" type="search" placeholder="Rechercher un coureur...">
  <div class="toolbar" style="margin-top:0;margin-bottom:10px">
    <button id="onlyFound">Trouvés</button>
    <button id="onlyNo">Non trouvés</button>
    <button id="export" class="primary">Export CSV</button>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr><th>Coureur</th><th>Temps</th><th>PB</th></tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script>
let ffa = [];
let ffaReady = false;
let pendingAutoParse = false;
let race = [];
let result = [];
let showOnlyNo = false;
let showOnlyFound = false;
const $ = id => document.getElementById(id);

function setImportEnabled(on){
  const el=$("pasteBtn");
  if(el) el.disabled=!on;
}

const STORAGE_KEY="comparateur10k_lastPaste";
function saveLastPaste(text){ try{ localStorage.setItem(STORAGE_KEY,text); }catch(e){} }
function loadLastPaste(){ try{ return localStorage.getItem(STORAGE_KEY)||""; }catch(e){ return ""; } }
function clearLastPaste(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

function runPasteAnalysis(){
  const text=$("paste").value;
  let parsed=parseUtmbPastedText(text);
  let source=parsed.length ? "UTMB" : "texte";

  if(!parsed.length) parsed=parsePlainText(text);
  if(!parsed.length && /<table/i.test(text)) parsed=parseHTML(text);

  race=parsed;
  $("raceMsg").textContent=parsed.length
    ? parsed.length+" participants détectés ("+source+")."
    : "Aucun participant reconnu.";
  if(parsed.length) saveLastPaste(text);
  compute();
}

function compute() {
  result = computeResults(race, ffa);
  render();
}

function render() {
  const q=norm($("search").value);
  const rows=result.filter(x=>{
    if(showOnlyNo && x.status!=="none") return false;
    if(showOnlyFound && x.status==="none") return false;
    if(q && !norm(x.nom+" "+x.prenom).includes(q)) return false;
    return true;
  });
  $("tbody").innerHTML=rows.map(x=>{
    const p=x.p||{};
    const badge=x.status==="exact"
      ? `<span class="badge ok" title="${esc(x.matchDetail||"")}">Exact</span>`
      : x.status==="ambiguous"
        ? `<span class="badge warn" title="${esc(x.matchDetail||"")}">Ambigu</span>`
        : '<span class="badge no">Non trouvé</span>';
    const _ffaUrl = getFfaProfileUrl(p);
    const fullName = esc(x.nom+" "+x.prenom);
    const nameSpan = _ffaUrl
      ? `<a href="${esc(_ffaUrl)}" target="_blank" rel="noopener" class="runner-name" style="color:var(--accent);font-weight:700;text-decoration:none" title="${fullName}">${fullName}</a>`
      : `<b class="runner-name" title="${fullName}">${fullName}</b>`;
    return `<tr>
      <td>${nameSpan}${badge}</td>
      <td>${esc(x.temps)}</td>
      <td>${esc(p.pb_chrono||"—")}</td>
    </tr>`;
  }).join("");
  const total=result.length, exact=result.filter(x=>x.status==="exact").length,
    amb=result.filter(x=>x.status==="ambiguous").length, none=result.filter(x=>x.status==="none").length;
  $("sTotal").textContent=total; $("sExact").textContent=exact; $("sAmb").textContent=amb; $("sNone").textContent=none;
}

const restored=loadLastPaste();
if(restored){
  $("paste").value=restored;
  pendingAutoParse=true;
  $("raceMsg").textContent="Dernier classement restauré, analyse en cours…";
}

setImportEnabled(false);
$("baseStatus").textContent="Chargement de la base FFA…";
fetch("./ffa_base.json").then(r=>{
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}).then(rows=>{
  ffa=buildFfaFromCompact(rows);
  ffaReady=true;
  $("baseStatus").textContent="Base FFA : "+ffa.length+" profils chargés.";
  setImportEnabled(true);
  if(pendingAutoParse){ pendingAutoParse=false; runPasteAnalysis(); }
  else if(race.length){ compute(); }
}).catch(err=>{
  $("baseStatus").textContent="Erreur de chargement de la base FFA : "+(err&&err.message?err.message:err)+". Recharge la page.";
});

// Bouton "Coller" natif : déclenché par un vrai tap, donc un geste utilisateur
// frais aux yeux de Safari. iOS affiche toujours sa propre confirmation
// système ("Coller") avant d'autoriser la lecture du presse-papier par un
// site web — ce n'est pas quelque chose que le code peut supprimer, c'est
// une protection systématique d'iOS, pas un bug de l'appli.
$("pasteBtn").onclick=async()=>{
  try{
    const text=await navigator.clipboard.readText();
    if(!text){ $("raceMsg").textContent="Presse-papier vide."; return; }
    $("paste").value=text;
    if(ffaReady) runPasteAnalysis(); else pendingAutoParse=true;
  }catch(e){
    $("raceMsg").textContent="Collage automatique impossible ("+(e&&e.message?e.message:e)+"). Fais un appui long dans la zone de texte ci-dessous → Coller.";
  }
};

// Analyse automatique dès que le texte collé (bouton ou appui long manuel)
// change — plus besoin d'un bouton "Analyser" séparé.
let pasteDebounceTimer=null;
$("paste").addEventListener("input", ()=>{
  clearTimeout(pasteDebounceTimer);
  pasteDebounceTimer=setTimeout(()=>{
    const text=$("paste").value.trim();
    if(text.length<10) return;
    if(ffaReady) runPasteAnalysis(); else pendingAutoParse=true;
  }, 500);
});

$("clearRace").onclick=()=>{race=[];result=[];$("paste").value="";$("raceMsg").textContent="";clearLastPaste();render();};
$("search").addEventListener("input",render);
$("onlyFound").onclick=()=>{
  showOnlyFound=!showOnlyFound;
  if(showOnlyFound) showOnlyNo=false;
  $("onlyFound").textContent=showOnlyFound ? "Tous" : "Trouvés";
  $("onlyNo").textContent="Non trouvés";
  render();
};
$("onlyNo").onclick=()=>{
  showOnlyNo=!showOnlyNo;
  if(showOnlyNo) showOnlyFound=false;
  $("onlyNo").textContent=showOnlyNo ? "Tous" : "Non trouvés";
  $("onlyFound").textContent="Trouvés";
  render();
};
$("export").onclick=()=>exportResultCSV(result,"comparaison_ffa_10km.csv");
render();

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
</script>
</body>
</html>
