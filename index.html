<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Comparateur 10 km</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1115;font-family:system-ui;color:#fff}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0f1115}
#status{display:none;position:fixed;z-index:99999;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:12px;background:#171a21;border:1px solid #303744;border-radius:14px;color:#cbd3df;text-align:center;font-size:13px}
</style>
</head>
<body>
<iframe id="app" src="./app_base.html?v=37" title="Comparateur 10 km"></iframe>
<div id="status"></div>
<script>
(()=>{
 const frame=document.getElementById('app'),status=document.getElementById('status');
 const show=t=>{status.textContent=t;status.style.display='block'};
 function fromB64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return decodeURIComponent(escape(atob(s)))}
 function makeText(d){
  if(!d||!Array.isArray(d.r))throw new Error('Classement invalide.');
  const rows=d.r.filter(x=>x&&x[2]); if(!rows.length)throw new Error(d.error||'Aucun participant.');
  if(String(d.s||'').toUpperCase()==='UTMB')return rows.map(x=>{const rank=x[0]||'',time=x[1]||'',name=x[2]||'',sex=x[3]||'',cat=x[4]||'',uri=x[5]||'';const g=String(sex).toUpperCase()==='F'?'Femme':'Homme';const nm=uri?`[${name}](https://utmb.world/fr/runner/${uri})`:name;return [rank,time,nm,'-',g,cat||'-','-'].join('\n')}).join('\n');
  return rows.map(x=>`${x[0]||''}  ${x[2]||''}  ${x[1]||''}`).join('\n');
 }
 function importHash(){
  if(!location.hash.startsWith('#d='))return;
  try{
   show('Import du classement…');
   const d=JSON.parse(fromB64u(location.hash.slice(3)));
   if(d.s==='ERREUR')throw new Error(d.error||'Erreur du raccourci.');
   const doc=frame.contentDocument,ta=doc&&doc.getElementById('paste'),btn=doc&&doc.getElementById('parsePaste');
   if(!ta||!btn)throw new Error('Comparateur non chargé.');
   ta.value=makeText(d);ta.dispatchEvent(new Event('input',{bubbles:true}));btn.click();
   setTimeout(()=>{const n=Number(doc.getElementById('sTotal')?.textContent||0);if(n>0){show(n+' participants analysés.');setTimeout(()=>status.style.display='none',1200)}else show(doc.getElementById('raceMsg')?.textContent||'Aucun participant reconnu.');history.replaceState(null,'',location.pathname)},250);
  }catch(e){show('Erreur : '+(e.message||e))}
 }
 frame.addEventListener('load',()=>setTimeout(importHash,50));
})();
</script>
</body>
</html>
