<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>Comparateur 10 km</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0f1115;font-family:system-ui;color:#fff}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#0f1115}
#importBox{display:none;position:fixed;z-index:99999;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:12px;background:#171a21;border:1px solid #303744;border-radius:14px;box-shadow:0 8px 30px #0008}
#importBtn{width:100%;border:1px solid #3973cf;background:#2458a6;color:#fff;border-radius:10px;padding:14px 12px;font-size:16px;font-weight:800}
#status{font-size:12px;color:#9aa4b2;margin-top:8px;text-align:center;min-height:16px}
</style>
</head>
<body>
<iframe id="app" src="./app_base.html?v=36" title="Comparateur 10 km"></iframe>
<div id="importBox">
  <button id="importBtn" type="button">Importer le classement copié</button>
  <div id="status">Le raccourci a placé le classement dans le presse-papiers.</div>
</div>
<script>
(()=>{
  const qs=new URLSearchParams(location.search);
  const box=document.getElementById('importBox');
  const btn=document.getElementById('importBtn');
  const status=document.getElementById('status');
  const frame=document.getElementById('app');
  if(qs.get('mobileimport')==='1') box.style.display='block';

  function makeText(d){
    if(!d || !Array.isArray(d.r)) throw new Error('Classement invalide.');
    if(![3,4].includes(Number(d.v))) throw new Error('Version du classement non compatible.');
    const rows=d.r.filter(x=>x && x[2]);
    if(!rows.length) throw new Error('Aucun participant dans le presse-papiers.');

    if(String(d.s||'').toUpperCase()==='UTMB'){
      return rows.map(x=>{
        const rank=x[0]||'', time=x[1]||'', name=x[2]||'', sex=x[3]||'', cat=x[4]||'', uri=x[5]||'', nat=x[6]||'-', score=(x[7]===0||x[7])?String(x[7]):'-';
        const g=String(sex).toUpperCase()==='F'?'Femme':'Homme';
        const nm=uri?`[${name}](https://utmb.world/fr/runner/${uri})`:name;
        return [rank,time,nm,nat,g,cat||'-',score].join('\n');
      }).join('\n');
    }

    // GoTiming : le parseur texte du comparateur attend le nom AVANT le chrono.
    return rows.map(x=>`${x[0]||''}  ${x[2]||''}  ${x[1]||''}`).join('\n');
  }

  async function importClipboard(){
    btn.disabled=true;
    status.textContent='Lecture du classement…';
    try{
      const raw=await navigator.clipboard.readText();
      const d=JSON.parse(raw);
      if(d.s==='ERREUR') throw new Error(d.error||'Erreur du raccourci.');
      const text=makeText(d);
      const doc=frame.contentDocument;
      if(!doc) throw new Error('Comparateur non chargé.');
      const ta=doc.getElementById('paste')||doc.querySelector('textarea');
      const parse=doc.getElementById('parsePaste');
      if(!ta || !parse) throw new Error('Zone d’analyse introuvable.');

      ta.value=text;
      ta.dispatchEvent(new Event('input',{bubbles:true}));
      status.textContent=d.r.length+' participants reçus. Analyse…';
      parse.click();

      setTimeout(()=>{
        const msg=doc.getElementById('raceMsg');
        const total=doc.getElementById('sTotal');
        const n=total?Number(total.textContent||0):0;
        if(n>0){
          status.textContent=n+' participants analysés.';
          box.style.display='none';
          history.replaceState(null,'',location.pathname);
        }else{
          status.textContent=(msg&&msg.textContent)?msg.textContent:'Aucun participant reconnu.';
          btn.disabled=false;
        }
      },250);
    }catch(e){
      status.textContent='Erreur : '+(e.message||e);
      btn.disabled=false;
    }
  }
  btn.addEventListener('click',importClipboard);
})();
</script>
</body>
</html>
