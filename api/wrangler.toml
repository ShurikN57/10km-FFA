name = "ffa-comparateur-api"
main = "worker.js"
compatibility_date = "2026-08-31"
preview_urls = false
# four-distance ranking and Europe/Paris category cutoff use precomputed D1 ranks
# redeploy exact-name search priority

[[d1_databases]]
binding = "DB"
database_name = "ffa-stage-2027-42091141044-1"
database_id = "dba36189-b3f8-4ab4-a501-9a39c17e15aa"

# Limitation de débit par IP (Workers Rate Limiting). Large volontairement :
# les opérateurs mobiles partagent souvent une même IP entre beaucoup d'abonnés.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 300
  period = 60
