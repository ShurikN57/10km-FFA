<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Raccourci iPhone v3.7</title><style>body{font-family:system-ui;background:#0f1115;color:#fff;padding:20px}.card{max-width:760px;margin:16px auto;background:#171a21;padding:18px;border-radius:14px}button{width:100%;padding:15px;border:0;border-radius:10px;background:#c0392b;color:#fff;font-weight:800;font-size:17px}textarea{width:100%;height:320px;background:#0e1014;color:#fff;border:1px solid #444;border-radius:10px;padding:10px;box-sizing:border-box}li{margin:10px 0;line-height:1.4}</style></head><body><div class="card"><h1>Importer vers Comparateur — v3.7</h1><button id="copy">Copier le script v3.7</button><p id="msg"></p><textarea id="code" readonly>(async()=>{
const TARGET='https://shurikn57.github.io/10km-FFA/';
const C=s=>(s||'').toString().replace(/\s+/g,' ').trim();
const uniq=a=>{const m=new Map;for(const x of a){if(!x||!x.name)continue;const k=[x.rank,x.name,x.time].join('|');if(!m.has(k))m.set(k,x)}return[...m.values()]};
function b64u(s){return btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function parseNextJSON(doc){const scripts=[...doc.querySelectorAll('script[type="application/json"]')];if(!scripts.length)throw new Error('UTMB : JSON interne introuvable.');let best='',len=0;for(const s of scripts){const t=s.textContent||'';if(t.length>len){best=t;len=t.length}}return JSON.parse(best)}
function utmbRows(j){const a=j?.props?.pageProps?.results?.results;if(!Array.isArray(a))return[];return a.map(x=>({rank:String(x.rank??''),time:C(x.time),name:C(x.fullname),sex:x.gender==='F'?'F':'M',category:C(x.ageGroup),uri:C(x.runnerUri)})).filter(x=>x.rank&&x.name&&x.time)}
async function scanUTMB(){const first=parseNextJSON(document),res=first?.props?.pageProps?.results||{},total=Number(res.nbHits||0),limit=Number(res.limit||25)||25,pages=Math.max(1,Math.ceil(total/limit)),curUrl=new URL(location.href),cur=Number(curUrl.searchParams.get('page')||1),base=new URL(curUrl.href);base.searchParams.delete('page');const all=[...utmbRows(first)],jobs=[];for(let p=1;p<=pages;p++){if(p===cur)continue;jobs.push((async()=>{const u=new URL(base.href);if(p>1)u.searchParams.set('page',String(p));const r=await fetch(u.href,{credentials:'include',cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return utmbRows(parseNextJSON(new DOMParser().parseFromString(await r.text(),'text/html')) )})())}const chunks=await Promise.all(jobs);for(const c of chunks)all.push(...c);return uniq(all).sort((a,b)=>(+a.rank||999999)-(+b.rank||999999))}
function scanGoTiming(){const lines=(document.body?.innerText||'').split(/\n+/).map(C).filter(Boolean),out=[],rankRe=/^(\d{1,5})\.$/,timeRe=/^(?:\d{1,2}:)?\d{1,2}:\d{2}$/;for(let i=0;i<lines.length;i++){const rm=lines[i].match(rankRe);if(!rm)continue;const rank=rm[1],name=lines[i+1]||'';if(!/[A-Za-zÀ-ÿ]{2,}/.test(name))continue;let time='',cat='',sex='';for(let j=i+2;j<=Math.min(lines.length-1,i+7);j++){const v=lines[j];if(/Homme|Femme|Male|Female/i.test(v)){cat=v;sex=/Femme|Female/i.test(v)?'F':'M'}if(timeRe.test(v)){time=v;break}}if(time)out.push({rank,time,name,sex,category:cat,uri:''})}return uniq(out)}
const host=location.hostname.toLowerCase();let source='',rows=[];
if(host.includes('utmb.world')){source='UTMB';rows=await scanUTMB()}else if(host.includes('gotiming.fr')){source='GoTiming';rows=scanGoTiming()}else throw new Error('Site non reconnu.');
if(!rows.length)throw new Error('Aucun participant reconnu.');
const payload={v:5,s:source,r:rows.map(x=>[x.rank,x.time,x.name,x.sex,x.category,x.uri])};
completion(TARGET+'#d='+b64u(JSON.stringify(payload)));
})().catch(e=>completion('https://shurikn57.github.io/10km-FFA/#d='+btoa(JSON.stringify({v:5,s:'ERREUR',r:[],error:e.message})).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')));</textarea></div><div class="card"><h2>Raccourci v3.7 — 3 étapes</h2><ol><li>Recevoir depuis Feuille partagée.</li><li>Exécuter JavaScript sur la page web → colle ce script.</li><li>Ouvrir les URL → sélectionne exactement Résultat JavaScript.</li></ol><p>Supprime les actions Copier, Texte et toute action presse-papiers.</p></div><script>document.getElementById('copy').onclick=async()=>{const t=document.getElementById('code').value;await navigator.clipboard.writeText(t);document.getElementById('msg').textContent='Script v3.7 copié.'}</script></body></html>
