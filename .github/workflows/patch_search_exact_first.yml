name: Patch exact search priority
on:
  push:
    paths:
      - 'tools/patch_search_exact_first.py'
      - '.github/workflows/patch_search_exact_first.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_search_exact_first.py
      - name: Validate Worker syntax
        run: node --check cloudflare-prototype/worker.js
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-prototype/worker.js
          git commit -m "Prioritize exact athlete-name matches"
          git push
