name: Add full FFA ranking
on:
  push:
    paths:
      - '.github/workflows/add-full-ffa-ranking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/add_full_ffa_ranking.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Add full FFA ranking explorer"
          git push
