name: Apply multi-distance 5 km patch
on:
  push:
    paths:
      - 'tools/patch_multi_distance_5k.py'
      - '.github/workflows/apply_multi_distance_5k.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply patch
        run: python tools/patch_multi_distance_5k.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          s=Path('mobile.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          if not blocks:
              raise SystemExit('No inline script found')
          Path('/tmp/mobile-inline.js').write_text('\n'.join(blocks),encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html manifest.webmanifest sw.js
          git diff --cached --quiet && exit 0
          git commit -m "Add 5 km and 10 km distance selector"
          git push
