name: Restore working iOS icon reference

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-working-ios-icon-ref.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact working icon declaration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wanted='<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">'

          for name in ['index.html','mobile.html']:
              p=Path(name)
              s=p.read_text()
              s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', wanted, s)
              s=re.sub(r'\n?<link rel="apple-touch-icon-precomposed"[^>]*>', '', s)
              p.write_text(s)

          root=Path('apple-touch-icon.png')
          if root.exists():
              root.unlink()

          for name in ['index.html','mobile.html']:
              s=Path(name).read_text()
              assert wanted in s
              assert 'apple-touch-icon-precomposed' not in s
              assert 'https://shurikn57.github.io/10km-FFA/apple-touch-icon.png' not in s
          assert Path('icons/apple-touch-icon.png').exists()
          PY
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/restore-working-ios-icon-ref.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Restore known-working iOS icon reference'
          git push