name: PWA UI and ranking speed
on:
  push:
    paths:
      - '.github/workflows/pwa-hide-analysis-speed-ranking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/pwa_hide_analysis_speed_ranking.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Polish PWA mode and speed general ranking"
          git push
