name: Fix iOS touch icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-ios-touch-icon.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point iOS to PNG icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile.html')
          s=p.read_text()
          old='<link rel="apple-touch-icon" href="./icons/le-routard.svg">'
          new='<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">'
          if old not in s:
              raise SystemExit('apple-touch-icon SVG line not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/fix-ios-touch-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Le Routard iOS home screen icon'
          git push
