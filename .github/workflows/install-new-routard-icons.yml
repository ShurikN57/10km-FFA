name: Install validated Routard icons

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-new-routard-icons.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validated icons
        shell: bash
        run: |
          set -e
          echo '[... ELLIPSIZATION ...]' | base64 -d > icons/apple-touch-icon.png
          echo '' | base64 -d > icons/favicon-32x32.png
          echo '[... ELLIPSIZATION ...]' | base64 -d > icons/icon-192x192.png
          echo '' | base64 -d > icons/icon-512x512.png
          python - <<'PY'
          from PIL import Image
          expected={'apple-touch-icon.png':(180,180),'favicon-32x32.png':(32,32),'icon-192x192.png':(192,192),'icon-512x512.png':(512,512)}
          for name,size in expected.items():
              p='icons/'+name
              im=Image.open(p)
              assert im.format=='PNG', (name, im.format)
              assert im.mode=='RGB', (name, im.mode)
              assert im.size==size, (name, im.size)
              print(name, im.format, im.mode, im.size)
          PY
          grep -F '<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">' mobile.html
          grep -F '<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">' index.html
      - name: Commit icons and self-remove
        run: |
          set -e
          rm -f .github/workflows/install-new-routard-icons.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/apple-touch-icon.png icons/favicon-32x32.png icons/icon-192x192.png icons/icon-512x512.png .github/workflows/install-new-routard-icons.yml
          git commit -m 'Install validated Le Routard icons'
          git push
