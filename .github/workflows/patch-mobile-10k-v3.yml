name: Patch mobile 10k V3
on:
  push:
    paths:
      - 'tools/patch_mobile_10k_v3.py'
      - '.github/workflows/patch-mobile-10k-v3.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python tools/patch_mobile_10k_v3.py
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('mobile.html').read_text(encoding='utf-8')
          start=s.rfind('<script>')+len('<script>')
          end=s.rfind('</script>')
          Path('/tmp/mobile-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
          node --check sw.js
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html sw.js
          git commit -m "Use new 10k V3 compact base with safe fallback"
          git push
