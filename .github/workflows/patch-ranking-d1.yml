name: Patch ranking to Cloudflare D1 API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ranking-d1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Worker short name filters
        shell: python
        run: |
          from pathlib import Path
          p=Path('cloudflare-prototype/worker.js')
          s=p.read_text(encoding='utf-8')
          old="""      if (ftsQuery) { outerWhere.push('id IN (SELECT rowid FROM athlete_fts WHERE athlete_fts MATCH ?)'); outerBinds.push(ftsQuery); }"""
          new="""      if (ftsQuery) { outerWhere.push('id IN (SELECT rowid FROM athlete_fts WHERE athlete_fts MATCH ?)'); outerBinds.push(ftsQuery); }
      else if (q) { outerWhere.push('name_key LIKE ?'); outerBinds.push(`%${q}%`); }"""
          assert old in s
          s=s.replace(old,new,1)
          old="""        SELECT id,full_name,birth_year,sex,pb_sec,pb_course,pb_date,club,athlete_ffa_id,"""
          new="""        SELECT id,name_key,full_name,birth_year,sex,pb_sec,pb_course,pb_date,club,athlete_ffa_id,"""
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

      - name: Patch mobile ranking
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('mobile.html')
          s=p.read_text(encoding='utf-8')

          old='''  if(tab==="classement"){
    if(ffaReady && ffaLoadedDistance===currentDistance && typeof renderFullFfaRanking==="function") renderFullFfaRanking(false);
    else {
      const m=$("ffaFullMsg"); if(m) m.textContent="Chargement du classement FFA…";
      ensureFfaLoaded().then(()=>{ if(activeAppTab==="classement" && ffaReady) renderFullFfaRanking(false); });
    }
  }
  if(tab==="recherche" && typeof renderFfaAthleteSearch==="function") renderFfaAthleteSearch();
  if(tab==="analyse" && (!ffaReady || ffaLoadedDistance!==currentDistance)) ensureFfaLoaded();'''
          new='''  if(tab==="classement" && typeof renderFullFfaRanking==="function") renderFullFfaRanking(false);
  if(tab==="recherche" && typeof renderFfaAthleteSearch==="function") renderFfaAthleteSearch();
  if(tab==="analyse" && (!ffaReady || ffaLoadedDistance!==currentDistance)) ensureFfaLoaded();'''
          assert old in s
          s=s.replace(old,new,1)

          pattern=r'function scopedFullRankMap\(sex,cat,year\)\{.*?\n\}\n\["ffaFullSearch","ffaFullSex","ffaFullCategory","ffaFullYear","ffaFullMinPb","ffaFullMaxPb"\]\.forEach\(id=>\{.*?\n\}\);'
          replacement=r'''let ffaRankingToken=0;
let ffaFullTimer=null;
async function renderFullFfaRanking(resetPage=false){
  if(resetPage) ffaFullPage=0;
  const box=$("ffaFullResults"), msg=$("ffaFullMsg");
  if(!box||!msg) return;
  const token=++ffaRankingToken;
  const q=String($("ffaFullSearch").value||"").trim();
  const sex=$("ffaFullSex").value;
  const cat=$("ffaFullCategory").value;
  const year=String($("ffaFullYear").value||"").trim();
  const minPb=parsePbLimit($("ffaFullMinPb").value);
  const maxPb=parsePbLimit($("ffaFullMaxPb").value);
  const params=new URLSearchParams({distance:currentDistance,page:String(ffaFullPage+1)});
  if(q) params.set("q",q);
  if(sex) params.set("sex",sex);
  if(cat) params.set("category",cat);
  if(year) params.set("year",year);
  if(minPb!=null) params.set("minPb",String(minPb));
  if(maxPb!=null) params.set("maxPb",String(maxPb));
  msg.textContent="Chargement du classement…";
  try{
    const r=await fetch(FFA_API+"/ranking?"+params.toString(),{cache:"no-store"});
    if(!r.ok) throw new Error("HTTP "+r.status);
    const data=await r.json();
    if(token!==ffaRankingToken) return;
    const rows=Array.isArray(data.rows)?data.rows:[];
    const total=Number(data.total)||0;
    const pages=Math.max(1,Number(data.pages)||1);
    const apiPage=Math.max(1,Number(data.page)||1);
    ffaFullPage=apiPage-1;
    msg.textContent=total.toLocaleString("fr-FR")+" athlète"+(total>1?"s":"")+" · page "+apiPage+"/"+pages;
    box.innerHTML=rows.length ? rows.map(r=>{
      const p={
        full_name:r.full_name||"",
        annee_naissance:r.birth_year||"",
        sexe:r.sex||"",
        pb_sec:Number(r.pb_sec),
        pb_chrono:Number.isFinite(Number(r.pb_sec))?chronoFromSec(Number(r.pb_sec)):"",
        pb_course:r.pb_course||"",
        pb_date:r.pb_date||"",
        club:r.club||"",
        athlete_ffa_id:r.athlete_ffa_id||""
      };
      const rank=Number(r.rank)||0;
      const rankText=rank?rank.toLocaleString("fr-FR"):"—";
      const url=getFfaProfileUrl(p);
      const catText=currentFfaCategory(p);
      const link=url ? `<a href="${esc(url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;font-weight:700">${esc(p.full_name||"")}</a>` : `<b>${esc(p.full_name||"")}</b>`;
      const meta=[p.annee_naissance||"—",p.sexe||"",catText].filter(Boolean).join(" · ");
      const rankSize=rank>=100000?"12px":rank>=10000?"13px":"14px";
      return `<div style="display:grid;grid-template-columns:68px minmax(0,1fr) 72px;gap:6px;align-items:center;padding:9px 10px;border-bottom:1px solid var(--line)"><div style="font-weight:800;font-size:${rankSize};text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap">${esc(rankText)}</div><div style="min-width:0"><div style="overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.18">${link}</div><div class="small">${esc(meta)}</div></div><div style="text-align:right;font-weight:800;white-space:nowrap">${esc(p.pb_chrono||"—")}</div></div>`;
    }).join("") : `<div class="msg" style="padding:12px">Aucun athlète avec ces filtres.</div>`;
    $("ffaFullPrev").disabled=ffaFullPage<=0;
    $("ffaFullNext").disabled=ffaFullPage>=pages-1;
  }catch(err){
    if(token!==ffaRankingToken) return;
    msg.textContent="Classement FFA indisponible. Réessaie dans quelques secondes.";
    box.innerHTML="";
    $("ffaFullPrev").disabled=true;
    $("ffaFullNext").disabled=true;
  }
}
function scheduleFullFfaRanking(){
  clearTimeout(ffaFullTimer);
  ffaFullTimer=setTimeout(()=>renderFullFfaRanking(true),260);
}
["ffaFullSearch","ffaFullYear","ffaFullMinPb","ffaFullMaxPb"].forEach(id=>{
  const el=$(id); if(el) el.addEventListener("input",scheduleFullFfaRanking);
});
["ffaFullSex","ffaFullCategory"].forEach(id=>{
  const el=$(id); if(el) el.addEventListener("change",()=>renderFullFfaRanking(true));
});'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          assert n==1, n

          old='''  if(activeAppTab==="recherche" && !localBaseInMemory){
    currentDistance=d;
    try{ localStorage.setItem("comparateur_ffa_distance",d); }catch(e){}
    updateDistanceUi();
    refreshRestoreButton();
    renderFfaAthleteSearch();
    return;
  }'''
          new='''  if((activeAppTab==="recherche" || activeAppTab==="classement") && !localBaseInMemory){
    currentDistance=d;
    try{ localStorage.setItem("comparateur_ffa_distance",d); }catch(e){}
    updateDistanceUi();
    refreshRestoreButton();
    if(activeAppTab==="classement") renderFullFfaRanking(true); else renderFfaAthleteSearch();
    return;
  }'''
          assert old in s
          s=s.replace(old,new,1)

          old='''if(activeAppTab==="classement" || activeAppTab==="analyse") ensureFfaLoaded();
else renderFfaAthleteSearch();'''
          new='''if(activeAppTab==="analyse") ensureFfaLoaded();
else if(activeAppTab==="classement") renderFullFfaRanking(true);
else renderFfaAthleteSearch();'''
          assert old in s
          s=s.replace(old,new,1)

          s=s.replace("navigator.serviceWorker.register('./sw.js?v=20260831f')","navigator.serviceWorker.register('./sw.js?v=20260831g')",1)
          assert 'function scopedFullRankMap' not in s
          assert 'async function renderFullFfaRanking' in s
          assert 'if(activeAppTab==="analyse") ensureFfaLoaded();' in s
          p.write_text(s,encoding='utf-8')

      - name: Validate JavaScript
        run: |
          node --check cloudflare-prototype/worker.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('mobile.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks
          Path('/tmp/mobile-inline.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
          git diff --check

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html cloudflare-prototype/worker.js
          git commit -m "Use D1 API for FFA ranking"
          git push
