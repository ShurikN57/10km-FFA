name: Patch ranking to Cloudflare D1 API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ranking-d1.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python cloudflare-prototype/temp_patch_ranking.py
      - name: Validate JavaScript
        run: |
          node --check cloudflare-prototype/worker.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('mobile.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks
          Path('/tmp/mobile-inline.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
          git diff --check
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html cloudflare-prototype/worker.js
          git commit -m "Use D1 API for FFA ranking"
          git push
