name: Repair Apple Touch Icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-apple-touch-icon.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore valid PNG icon bytes
        run: |
          git cat-file blob 71d5cab994b986cbd07eeb22d6c1bed76dd19ea9 > icons/apple-touch-icon.png
          file icons/apple-touch-icon.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('icons/apple-touch-icon.png')
          assert im.size == (180,180), im.size
          print(im.format, im.size, im.mode)
          PY
      - name: Commit repair and cleanup
        run: |
          rm .github/workflows/repair-apple-touch-icon.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add icons/apple-touch-icon.png .github/workflows/repair-apple-touch-icon.yml
          git commit -m "Repair Apple touch icon PNG"
          git push
