name: Fix import flow
on:
  push:
    paths:
      - '.github/workflows/fix-import-flow.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/fix_import_flow.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html" index.html
          git commit -m "Fix import to analysis flow"
          git push
