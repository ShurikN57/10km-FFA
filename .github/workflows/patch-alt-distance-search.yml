name: Patch alternate distance search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-alt-distance-search.yml'
      - 'temp_patch_alt_distance_search.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python temp_patch_alt_distance_search.py
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('mobile.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/mobile-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile.html
          git commit -m "Suggest alternate distance when search has no result"
          git push
