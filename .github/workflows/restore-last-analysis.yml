name: Restore last analysis
on:
  push:
    paths:
      - '.github/workflows/restore-last-analysis.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/restore_last_analysis.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Restore last analysis after clearing"
          git push
