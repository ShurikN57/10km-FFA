name: Deploy Cloudflare FFA API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-cloudflare-worker.yml'
      - 'cloudflare-prototype/worker.js'
      - 'cloudflare-prototype/wrangler.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API_URL: https://ffa-comparateur-api.57compte2.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Validate Worker syntax
        run: node --check cloudflare-prototype/worker.js
      - name: Deploy Worker
        working-directory: cloudflare-prototype
        run: npx --yes wrangler@latest deploy
      - name: Smoke test API
        run: |
          python - <<'PY'
          import json, urllib.parse, urllib.request
          base='https://ffa-comparateur-api.57compte2.workers.dev'
          with urllib.request.urlopen(base+'/health', timeout=20) as r:
              health=json.load(r)
          assert health.get('ok') is True, health
          assert health.get('athletes') == 650722, health
          q=urllib.parse.urlencode({'distance':'10k','q':'MACHOUCHE'})
          with urllib.request.urlopen(base+'/search?'+q, timeout=20) as r:
              search=json.load(r)
          rows=search.get('rows') or []
          assert isinstance(rows, list), search
          print('health=', health)
          print('search_rows=', len(rows))
          print('first=', rows[0] if rows else None)
          PY
