name: Import Semi and Marathon FFA

on:
  push:
    branches: [main]
    paths:
      - 'ffa_semi_2024_2026.json.gz'
      - 'ffa_marathon_2024_2026.json.gz'
      - '.github/workflows/import-semi-marathon.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Require both consolidated bases
        run: |
          test -f ffa_semi_2024_2026.json.gz
          test -f ffa_marathon_2024_2026.json.gz

      - name: Validate and prepare SQL chunks
        run: |
          python - <<'PY'
          import gzip,json,re,unicodedata
          from pathlib import Path

          files=[
            ('semi','ffa_semi_2024_2026.json.gz','Semi-marathon','271'),
            ('marathon','ffa_marathon_2024_2026.json.gz','Marathon','295'),
          ]
          expected_schema=['full_name','birth_year','sex','pb_sec','pb_course','pb_date','club','athlete_ffa_id']
          out=Path('/tmp/ffa_sql'); out.mkdir(exist_ok=True)

          def norm(s):
            s=unicodedata.normalize('NFD',str(s or ''))
            s=''.join(c for c in s if unicodedata.category(c)!='Mn').upper()
            return re.sub(r'\s+',' ',re.sub(r'[^A-Z0-9]+',' ',s)).strip()
          def q(v):
            if v is None: return 'NULL'
            return "'"+str(v).replace("'","''")+"'"
          def n(v):
            try:
              x=int(str(v).strip())
              return str(x)
            except Exception:
              return 'NULL'

          all_rows=[]
          for distance,fn,discipline,event in files:
            with gzip.open(fn,'rt',encoding='utf-8') as f: d=json.load(f)
            if d.get('schema')!=expected_schema: raise SystemExit(f'{fn}: schema inattendu {d.get("schema")}')
            if str(d.get('discipline','')).strip()!=discipline: raise SystemExit(f'{fn}: discipline inattendue {d.get("discipline")}')
            if d.get('event') not in (None,'',event): raise SystemExit(f'{fn}: event inattendu {d.get("event")}')
            rows=d.get('rows')
            if not isinstance(rows,list) or not rows: raise SystemExit(f'{fn}: aucune ligne')
            bad=0
            for r in rows:
              if not isinstance(r,list) or len(r)<8: bad+=1; continue
              try: sec=int(r[3])
              except Exception: bad+=1; continue
              if sec<=0 or not str(r[0] or '').strip(): bad+=1; continue
              sex=str(r[2] or '').upper().strip()
              if sex not in ('M','F'): bad+=1; continue
              all_rows.append((distance,r,sec,sex))
            if bad: raise SystemExit(f'{fn}: {bad} lignes invalides')
            print(f'{distance}: {len(rows):,} lignes valides')

          pre='''
          DELETE FROM athlete_general_rank WHERE distance IN ('semi','marathon');
          DELETE FROM athlete_search_rank WHERE athlete_id IN (SELECT id FROM athletes WHERE distance IN ('semi','marathon'));
          DELETE FROM athlete_rank_year WHERE athlete_id IN (SELECT id FROM athletes WHERE distance IN ('semi','marathon'));
          DELETE FROM athlete_rank_cat_before WHERE athlete_id IN (SELECT id FROM athletes WHERE distance IN ('semi','marathon'));
          DELETE FROM athlete_rank_cat_after WHERE athlete_id IN (SELECT id FROM athletes WHERE distance IN ('semi','marathon'));
          DELETE FROM athletes WHERE distance IN ('semi','marathon');
          DELETE FROM ffa_distance_stats WHERE distance IN ('semi','marathon');
          '''
          (out/'000_pre.sql').write_text(pre,encoding='utf-8')

          file_chunk_size=20000
          statement_size=100
          chunk=[]; idx=1
          def flush():
            global idx,chunk
            if not chunk:return
            statements=[]
            for pos in range(0,len(chunk),statement_size):
              batch=chunk[pos:pos+statement_size]
              statements.append('INSERT INTO athletes(distance,full_name,name_key,birth_year,sex,pb_sec,pb_course,pb_date,club,athlete_ffa_id) VALUES\n'+',\n'.join(batch)+';')
            (out/f'{idx:04d}_rows.sql').write_text('\n'.join(statements)+'\n',encoding='utf-8')
            idx+=1;chunk=[]

          for distance,r,sec,sex in all_rows:
            full=str(r[0] or '').strip(); by=n(r[1]); course=str(r[4] or '').strip(); date=str(r[5] or '').strip(); club=str(r[6] or '').strip(); aid=str(r[7] or '').strip()
            chunk.append('('+','.join([q(distance),q(full),q(norm(full)),by,q(sex),str(sec),q(course),q(date),q(club),q(aid)])+')')
            if len(chunk)>=file_chunk_size: flush()
          flush()

          before="CASE WHEN birth_year BETWEEN 2009 AND 2010 THEN 'CA' WHEN birth_year BETWEEN 2007 AND 2008 THEN 'JU' WHEN birth_year BETWEEN 2004 AND 2006 THEN 'ES' WHEN birth_year BETWEEN 1992 AND 2003 THEN 'SE' WHEN birth_year BETWEEN 1987 AND 1991 THEN 'M0' WHEN birth_year BETWEEN 1982 AND 1986 THEN 'M1' WHEN birth_year BETWEEN 1977 AND 1981 THEN 'M2' WHEN birth_year BETWEEN 1972 AND 1976 THEN 'M3' WHEN birth_year BETWEEN 1967 AND 1971 THEN 'M4' WHEN birth_year BETWEEN 1962 AND 1966 THEN 'M5' WHEN birth_year BETWEEN 1957 AND 1961 THEN 'M6' WHEN birth_year BETWEEN 1952 AND 1956 THEN 'M7' WHEN birth_year BETWEEN 1947 AND 1951 THEN 'M8' WHEN birth_year BETWEEN 1942 AND 1946 THEN 'M9' WHEN birth_year<=1941 THEN 'M10' END"
          after="CASE WHEN birth_year BETWEEN 2010 AND 2011 THEN 'CA' WHEN birth_year BETWEEN 2008 AND 2009 THEN 'JU' WHEN birth_year BETWEEN 2005 AND 2007 THEN 'ES' WHEN birth_year BETWEEN 1993 AND 2004 THEN 'SE' WHEN birth_year BETWEEN 1988 AND 1992 THEN 'M0' WHEN birth_year BETWEEN 1983 AND 1987 THEN 'M1' WHEN birth_year BETWEEN 1978 AND 1982 THEN 'M2' WHEN birth_year BETWEEN 1973 AND 1977 THEN 'M3' WHEN birth_year BETWEEN 1968 AND 1972 THEN 'M4' WHEN birth_year BETWEEN 1963 AND 1967 THEN 'M5' WHEN birth_year BETWEEN 1958 AND 1962 THEN 'M6' WHEN birth_year BETWEEN 1953 AND 1957 THEN 'M7' WHEN birth_year BETWEEN 1948 AND 1952 THEN 'M8' WHEN birth_year BETWEEN 1943 AND 1947 THEN 'M9' WHEN birth_year<=1942 THEN 'M10' END"
          post=f'''
          INSERT INTO athlete_general_rank(athlete_id,distance,rank,display_order)
          SELECT id,distance,
                 RANK() OVER (PARTITION BY distance ORDER BY pb_sec ASC),
                 ROW_NUMBER() OVER (PARTITION BY distance ORDER BY pb_sec ASC,full_name ASC,id ASC)
          FROM athletes WHERE distance IN ('semi','marathon');

          WITH b AS (
            SELECT id,distance,sex,pb_sec,{before} AS cb,{after} AS ca
            FROM athletes WHERE distance IN ('semi','marathon')
          ), r AS (
            SELECT id,
              RANK() OVER (PARTITION BY distance ORDER BY pb_sec) AS rg,
              RANK() OVER (PARTITION BY distance,sex ORDER BY pb_sec) AS rs,
              CASE WHEN cb IS NOT NULL THEN RANK() OVER (PARTITION BY distance,sex,cb ORDER BY pb_sec) END AS rcb,
              CASE WHEN ca IS NOT NULL THEN RANK() OVER (PARTITION BY distance,sex,ca ORDER BY pb_sec) END AS rca
            FROM b
          )
          INSERT INTO athlete_search_rank(athlete_id,rank_general,rank_sex,rank_cat_before_sep,rank_cat_after_sep)
          SELECT id,rg,rs,rcb,rca FROM r;

          INSERT INTO athlete_rank_year(athlete_id,rank_year,rank_sex_year)
          SELECT id,
            RANK() OVER (PARTITION BY distance,birth_year ORDER BY pb_sec),
            CASE WHEN sex IN ('M','F') THEN RANK() OVER (PARTITION BY distance,sex,birth_year ORDER BY pb_sec) END
          FROM athletes WHERE distance IN ('semi','marathon');

          WITH b AS (SELECT id,distance,pb_sec,{before} AS cat FROM athletes WHERE distance IN ('semi','marathon')),
          r AS (SELECT id,cat,RANK() OVER (PARTITION BY distance,cat ORDER BY pb_sec) AS rk FROM b WHERE cat IS NOT NULL)
          INSERT INTO athlete_rank_cat_before(athlete_id,rank_category) SELECT id,rk FROM r;

          WITH b AS (SELECT id,distance,pb_sec,{after} AS cat FROM athletes WHERE distance IN ('semi','marathon')),
          r AS (SELECT id,cat,RANK() OVER (PARTITION BY distance,cat ORDER BY pb_sec) AS rk FROM b WHERE cat IS NOT NULL)
          INSERT INTO athlete_rank_cat_after(athlete_id,rank_category) SELECT id,rk FROM r;

          INSERT OR REPLACE INTO ffa_distance_stats(distance,total)
          SELECT distance,COUNT(*) FROM athletes WHERE distance IN ('semi','marathon') GROUP BY distance;

          INSERT INTO athlete_fts(athlete_fts) VALUES('rebuild');
          '''
          (out/'9999_post.sql').write_text(post,encoding='utf-8')
          print(f'Total à importer: {len(all_rows):,}; chunks: {idx-1}')
          PY

      - name: Clear old Semi and Marathon rows
        run: npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=/tmp/ffa_sql/000_pre.sql

      - name: Import athlete rows
        run: |
          set -e
          for f in /tmp/ffa_sql/*_rows.sql; do
            echo "Import $f"
            npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file="$f"
          done

      - name: Build ranks stats and FTS
        run: npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=/tmp/ffa_sql/9999_post.sql

      - name: Verify D1 counts
        run: |
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT distance,COUNT(*) AS n FROM athletes GROUP BY distance ORDER BY distance;"
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT distance,total FROM ffa_distance_stats ORDER BY distance;"

      - name: Verify API
        run: |
          curl -fsS 'https://ffa-comparateur-api.57compte2.workers.dev/health'
          echo
          curl -fsS 'https://ffa-comparateur-api.57compte2.workers.dev/ranking?distance=semi&page=1' | head -c 500
          echo
          curl -fsS 'https://ffa-comparateur-api.57compte2.workers.dev/ranking?distance=marathon&page=1' | head -c 500
          echo
