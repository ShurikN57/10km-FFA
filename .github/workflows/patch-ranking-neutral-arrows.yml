name: Patch ranking neutral arrows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-ranking-neutral-arrows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch neutral ranking arrows
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile.html')
          s=p.read_text(encoding='utf-8')
          old="const arrow=active?(ffaFullSortDir==='asc'?'▲':'▼'):'↕';"
          new="const arrow=active?(ffaFullSortDir==='asc'?'▲':'▼'):'△ ▽';"
          if s.count(old) != 1:
              raise SystemExit(f'Expected exactly one ranking neutral arrow pattern, found {s.count(old)}')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('mobile.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/mobile-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile.html
          git commit -m "Refine inactive ranking sort arrows"
          git push
