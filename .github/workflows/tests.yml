name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier la syntaxe
        run: |
          node --check core.js
          node --check sw.js
          node --check cloudflare-prototype/worker.js
      - name: Tests unitaires
        run: npm test
