name: Restore safe PWA
on:
  push:
    paths:
      - '.github/workflows/restore-pwa-safe.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore and patch safely
        run: python .github/scripts/restore_pwa_safe.py
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('mobile.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          inline='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/mobile-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Restore working app and hide Analyse safely in PWA"
          git push
