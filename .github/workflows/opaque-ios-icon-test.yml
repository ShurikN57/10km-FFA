name: Opaque iOS icon test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opaque-ios-icon-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build verified opaque Apple icon
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          src=Path('icons/apple-touch-icon.png')
          im=Image.open(src).convert('RGBA')
          bg=Image.new('RGBA', im.size, (15,32,58,255))
          bg.alpha_composite(im)
          out=bg.convert('RGB').resize((180,180), Image.Resampling.LANCZOS)
          out.save('apple-touch-icon.png', format='PNG', optimize=True, compress_level=9)
          out.save('icons/apple-touch-icon.png', format='PNG', optimize=True, compress_level=9)
          for p in [Path('apple-touch-icon.png'),Path('icons/apple-touch-icon.png')]:
              data=p.read_bytes()
              assert data[:8] == b'\x89PNG\r\n\x1a\n', (p, data[:8])
              chk=Image.open(p)
              assert chk.format == 'PNG'
              assert chk.size == (180,180)
              assert chk.mode == 'RGB'
              print(p, chk.format, chk.size, chk.mode, len(data), data[:8].hex())
          PY
      - name: Point iOS to absolute root icon
        run: |
          python - <<'PY'
          from pathlib import Path
          url='https://shurikn57.github.io/10km-FFA/apple-touch-icon.png'
          for name in ['index.html','mobile.html']:
              p=Path(name)
              s=p.read_text()
              import re
              s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', f'<link rel="apple-touch-icon" sizes="180x180" href="{url}">', s)
              s=re.sub(r'<link rel="apple-touch-icon-precomposed"[^>]*>', f'<link rel="apple-touch-icon-precomposed" sizes="180x180" href="{url}">', s)
              p.write_text(s)
          PY
      - name: Verify HTML references
        run: |
          grep -n "apple-touch-icon" index.html mobile.html
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/opaque-ios-icon-test.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apple-touch-icon.png icons/apple-touch-icon.png index.html mobile.html .github/workflows/opaque-ios-icon-test.yml
          git commit -m "Use opaque validated iOS home screen icon"
          git push
