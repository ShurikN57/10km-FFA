name: Verify four FFA distances

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-four-distances.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify health ranking and search
        run: |
          set -e
          BASE='https://ffa-comparateur-api.57compte2.workers.dev'
          curl -fsS "$BASE/health" -o /tmp/health.json
          curl -fsS "$BASE/ranking?distance=semi&page=1" -o /tmp/semi-ranking.json
          curl -fsS "$BASE/ranking?distance=marathon&page=1" -o /tmp/marathon-ranking.json
          curl -fsS "$BASE/search?distance=semi&q=DAGUINOS&mode=general" -o /tmp/semi-search.json
          curl -fsS "$BASE/search?distance=marathon&q=AMDOUNI&mode=general" -o /tmp/marathon-search.json
          python - <<'PY'
          import json
          def read(p):
              with open(p,encoding='utf-8') as f:return json.load(f)
          h=read('/tmp/health.json')
          semi=read('/tmp/semi-ranking.json')
          mara=read('/tmp/marathon-ranking.json')
          ss=read('/tmp/semi-search.json')
          ms=read('/tmp/marathon-search.json')
          assert h.get('ok') is True and h.get('athletes')==1445655,h
          assert semi.get('total')==497767 and semi.get('rows'),semi
          assert mara.get('total')==297166 and mara.get('rows'),mara
          assert any('DAGUINOS' in str(x.get('full_name','')).upper() for x in ss.get('rows',[])),ss
          assert any('AMDOUNI' in str(x.get('full_name','')).upper() for x in ms.get('rows',[])),ms
          print('health',h)
          print('semi ranking',semi['total'],semi['rows'][0]['full_name'])
          print('marathon ranking',mara['total'],mara['rows'][0]['full_name'])
          print('semi search',len(ss['rows']))
          print('marathon search',len(ms['rows']))
          PY
