name: Reduce Safari memory
on:
  push:
    paths:
      - '.github/workflows/reduce-safari-memory.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/reduce_safari_memory.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Reduce Safari memory use in ranking"
          git push
