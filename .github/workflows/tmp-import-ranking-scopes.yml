name: Resume ranking scope metadata publication

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-import-ranking-scopes.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffa-d1-import
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify completed staging metadata
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT SUM(distance='5k') AS n5,SUM(distance='10k') AS n10,SUM(distance='semi') AS ns,SUM(distance='marathon') AS nm,COUNT(*) AS total FROM athlete_scope_next;" --config=cloudflare-prototype/wrangler.toml --yes --json)
          echo "$result" | jq '.[0].results[0]'
          echo "$result" | jq -e '.[0].results[0] | .n5==124626 and .n10==533085 and .ns==490879 and .nm==288475 and .total==1437065'

      - name: Create filter options table
        shell: bash
        run: |
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="DROP TABLE IF EXISTS ffa_scope_options_next; CREATE TABLE ffa_scope_options_next(distance TEXT NOT NULL,league TEXT NOT NULL,department TEXT NOT NULL,club TEXT NOT NULL,race_year INTEGER);" --config=cloudflare-prototype/wrangler.toml --yes
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="INSERT INTO ffa_scope_options_next(distance,league,department,club,race_year) SELECT DISTINCT s.distance,s.league,s.department,COALESCE(a.club,''),s.race_year FROM athlete_scope_next s JOIN athletes a ON a.id=s.athlete_id;" --config=cloudflare-prototype/wrangler.toml --yes
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="CREATE INDEX idx_scope_options_next_distance ON ffa_scope_options_next(distance,league,department,club,race_year);" --config=cloudflare-prototype/wrangler.toml --yes

      - name: Verify staging options
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT distance,COUNT(*) AS options FROM ffa_scope_options_next GROUP BY distance ORDER BY distance;" --config=cloudflare-prototype/wrangler.toml --yes --json)
          echo "$result" | jq '.[0].results'
          echo "$result" | jq -e '.[0].results | length==4 and all(.options>0)'

      - name: Publish scope tables
        shell: bash
        run: |
          cat > /tmp/publish_scope.sql <<'SQL'
          DROP TABLE IF EXISTS athlete_scope;
          DROP TABLE IF EXISTS ffa_scope_options;
          ALTER TABLE athlete_scope_next RENAME TO athlete_scope;
          ALTER TABLE ffa_scope_options_next RENAME TO ffa_scope_options;
          SQL
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=/tmp/publish_scope.sql --config=cloudflare-prototype/wrangler.toml --yes

      - name: Verify published filters
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT SUM(distance='5k') AS n5,SUM(distance='10k') AS n10,SUM(distance='semi') AS ns,SUM(distance='marathon') AS nm,COUNT(*) AS total FROM athlete_scope;" --config=cloudflare-prototype/wrangler.toml --yes --json)
          echo "$result" | jq -e '.[0].results[0] | .n5==124626 and .n10==533085 and .ns==490879 and .nm==288475 and .total==1437065'
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT distance,COUNT(*) AS total,SUM(league<>'') AS with_region,SUM(department<>'') AS with_department,SUM(race_year IS NOT NULL) AS with_race_year FROM athlete_scope GROUP BY distance ORDER BY distance;" --config=cloudflare-prototype/wrangler.toml --yes
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT COUNT(*) AS n FROM athlete_scope WHERE distance='10k' AND league='G-E' AND department='057';" --config=cloudflare-prototype/wrangler.toml --yes
