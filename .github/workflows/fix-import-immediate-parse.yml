name: Fix import immediate parse
on:
  push:
    paths:
      - '.github/workflows/fix-import-immediate-parse.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/fix_import_immediate_parse.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Parse imported participants before FFA load"
          git push
