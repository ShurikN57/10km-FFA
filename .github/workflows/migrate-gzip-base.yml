name: Migrate comparator to gzip base

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/migrate-gzip-base.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Switch desktop and mobile to ffa_base.json.gz
        shell: python
        run: |
          from pathlib import Path
          import re

          files = [Path('mobile.html'), Path('app base.html')]
          pattern = re.compile(
              r'''fetch\(["']\./ffa_base\.json["']\)\.then\(r=>\{\s*'''
              r'''if\(!r\.ok\)\s*throw new Error\("HTTP "\+r\.status\);\s*'''
              r'''return r\.json\(\);\s*\}\)\.then\(rows=>\{''',
              re.S,
          )
          replacement = '''async function loadFfaRows(){
            const r=await fetch("./ffa_base.json.gz");
            if(!r.ok) throw new Error("HTTP "+r.status);
            if(!("DecompressionStream" in window)) {
              throw new Error("Décompression gzip non prise en charge par ce navigateur");
            }
            if(!r.body) throw new Error("Flux de la base FFA indisponible");
            const stream=r.body.pipeThrough(new DecompressionStream("gzip"));
            const text=await new Response(stream).text();
            return JSON.parse(text);
          }
          loadFfaRows().then(rows=>{'''

          changed = []
          for path in files:
              text = path.read_text(encoding='utf-8')
              new_text, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f"Bloc de chargement introuvable ou multiple dans {path}: {n}")
              path.write_text(new_text, encoding='utf-8')
              changed.append(str(path))
          print('Modifiés:', ', '.join(changed))
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Load compressed FFA base in desktop and mobile"
          git push
