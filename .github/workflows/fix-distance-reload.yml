name: Temporary Safari distance reload fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-distance-reload.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Safari/PWA distance switching
        shell: python
        run: |
          from pathlib import Path

          mobile = Path('mobile.html')
          s = mobile.read_text(encoding='utf-8')

          old = '''document.querySelectorAll("[data-distance]").forEach(btn=>btn.addEventListener("click",()=>{
            const d=btn.getAttribute("data-distance");
            if(d!==currentDistance) loadFfaDistance(d);
          }));'''
          new = '''document.querySelectorAll("[data-distance]").forEach(btn=>btn.addEventListener("click",()=>{
            const d=btn.getAttribute("data-distance");
            if(d===currentDistance || !FFA_DISTANCES[d]) return;
            // Safari/iOS : repartir dans un document neuf garantit que l'ancienne
            // grosse base est réellement libérée avant de charger la suivante.
            try{ localStorage.setItem("comparateur_ffa_distance",d); }catch(e){}
            location.reload();
          }));'''
          if old not in s:
              raise SystemExit('Distance click block not found')
          s = s.replace(old, new, 1)

          old_sw_reg = "navigator.serviceWorker.register('./sw.js').catch(()=>{})"
          new_sw_reg = "navigator.serviceWorker.register('./sw.js?v=20260831e').catch(()=>{})"
          if old_sw_reg not in s:
              raise SystemExit('Service worker registration block not found')
          s = s.replace(old_sw_reg, new_sw_reg, 1)
          mobile.write_text(s, encoding='utf-8')

          sw = Path('sw.js')
          w = sw.read_text(encoding='utf-8')
          if "const SHELL_CACHE='comparateur-ffa-shell-v8';" not in w:
              raise SystemExit('Expected SW cache version not found')
          w = w.replace("const SHELL_CACHE='comparateur-ffa-shell-v8';", "const SHELL_CACHE='comparateur-ffa-shell-v9';", 1)
          sw.write_text(w, encoding='utf-8')
      - name: Validate JavaScript syntax
        run: |
          node --check core.js
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('mobile.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s,re.I)
          inline='\n'.join(x for x in scripts if x.strip())
          Path('/tmp/mobile-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
          node --check sw.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html sw.js
          git commit -m "Reload cleanly when switching FFA distance on Safari"
          git push
