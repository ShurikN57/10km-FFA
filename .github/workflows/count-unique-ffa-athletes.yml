name: Count unique FFA athletes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/count-unique-ffa-athletes.yml'

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Count unique athletes
        working-directory: cloudflare-prototype
        run: |
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --json --command "
            WITH
            linked AS (
              SELECT TRIM(athlete_ffa_id) AS person_key
              FROM athletes
              WHERE athlete_ffa_id IS NOT NULL AND TRIM(athlete_ffa_id) <> ''
              GROUP BY TRIM(athlete_ffa_id)
            ),
            unlinked AS (
              SELECT name_key || '|' || COALESCE(CAST(birth_year AS TEXT), '') || '|' || COALESCE(sex, '') AS person_key
              FROM athletes
              WHERE athlete_ffa_id IS NULL OR TRIM(athlete_ffa_id) = ''
              GROUP BY name_key, birth_year, sex
            )
            SELECT
              (SELECT COUNT(*) FROM linked) AS unique_linked_athletes,
              (SELECT COUNT(*) FROM unlinked) AS estimated_unique_unlinked_athletes,
              (SELECT COUNT(*) FROM linked) + (SELECT COUNT(*) FROM unlinked) AS estimated_unique_athletes_total;
          " > unique_ffa_athletes_count.json
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --json --command "
            SELECT
              COUNT(*) AS distance_rows,
              COUNT(DISTINCT distance || '|' || name_key || '|' || COALESCE(CAST(birth_year AS TEXT), '') || '|' || COALESCE(sex, '')) AS unique_identity_distance_rows
            FROM athletes;
          " > unique_ffa_athletes_control.json
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-prototype/unique_ffa_athletes_count.json cloudflare-prototype/unique_ffa_athletes_control.json
          git diff --cached --quiet || git commit -m "Record unique FFA athlete count"
          git push
