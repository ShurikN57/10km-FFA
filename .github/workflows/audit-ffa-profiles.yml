name: Audit FFA profile identifiers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-ffa-profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Query profile identifier coverage
        working-directory: cloudflare-prototype
        run: |
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --json --command "
            SELECT
              distance,
              COUNT(*) AS profiles,
              SUM(CASE WHEN athlete_ffa_id IS NULL OR TRIM(athlete_ffa_id) = '' THEN 1 ELSE 0 END) AS missing_ids,
              SUM(CASE WHEN athlete_ffa_id IS NOT NULL AND TRIM(athlete_ffa_id) <> '' THEN 1 ELSE 0 END) AS linked_profiles
            FROM athletes
            GROUP BY distance
            ORDER BY distance;
          " > profile_identifier_audit.json
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --json --command "
            SELECT distance, full_name, name_key, birth_year, sex, pb_sec, club
            FROM athletes
            WHERE athlete_ffa_id IS NULL OR TRIM(athlete_ffa_id) = ''
            ORDER BY distance, full_name, birth_year
            LIMIT 1000;
          " > missing_profile_identifiers_sample.json
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare-prototype/profile_identifier_audit.json cloudflare-prototype/missing_profile_identifiers_sample.json
          git diff --cached --quiet || git commit -m "Audit missing FFA profile identifiers"
          git push
