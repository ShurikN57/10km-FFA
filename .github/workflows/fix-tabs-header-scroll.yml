name: Fix tabs header and scroll
on:
  push:
    paths:
      - '.github/workflows/fix-tabs-header-scroll.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/fix_tabs_header_scroll.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Improve tab fluidity and remove shared header"
          git push
