name: Install approved Le Routard logo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-approved-logo.yml'
      - '.github/icon-source.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild validated PNG icons
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/icon-source.b64 > /tmp/source.png
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          src = Image.open('/tmp/source.png').convert('RGB')
          targets = [
              (180, 'icons/apple-touch-icon.png'),
              (192, 'icons/icon-192x192.png'),
              (512, 'icons/icon-512x512.png'),
              (32, 'icons/favicon-32x32.png'),
          ]
          for size, path in targets:
              im = src.resize((size, size), Image.Resampling.LANCZOS).convert('RGB')
              im.save(path, 'PNG', optimize=True, compress_level=9)
              chk = Image.open(path)
              assert chk.format == 'PNG'
              assert chk.size == (size, size)
              assert chk.mode == 'RGB'
              print(path, chk.size, chk.mode)
          PY
          file icons/apple-touch-icon.png icons/icon-192x192.png icons/icon-512x512.png icons/favicon-32x32.png
      - name: Commit icons and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/icon-source.b64
          rm -f .github/workflows/install-approved-logo.yml
          rm -f .github/workflows/install-new-routard-icons.yml
          rm -f .github/workflows/restore-known-working-icon-file.yml
          rm -f icons/test.txt icons/test2.txt icons/test3.txt icons/test4.txt icons/test5.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install approved Le Routard PWA logo'
          git push
