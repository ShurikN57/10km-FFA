name: Fix multi-distance loader
on:
  push:
    paths:
      - '.github/scripts/fix_multidistance_loader.py'
      - '.github/workflows/fix-multidistance-loader.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply loader fix
        run: python .github/scripts/fix_multidistance_loader.py
      - name: Validate inline JavaScript syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('mobile.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',t,re.S)
          inline='\n'.join(s for s in scripts if s.strip())
          Path('/tmp/mobile-inline.js').write_text(inline,encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html sw.js
          git commit -m "Fix 5 km and 10 km data loading on Safari"
          git push
