name: Update PWA branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-pwa-brand.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update mobile PWA title
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<meta name="apple-mobile-web-app-title" content="Comparateur FFA">', '<meta name="apple-mobile-web-app-title" content="Le Routard">')
          s = s.replace('<title>Comparateur FFA — mobile</title>', '<title>Le Routard</title>')
          if '<link rel="icon" href="./icons/le-routard.svg" type="image/svg+xml">' not in s:
              s = s.replace('<link rel="manifest" href="./manifest.webmanifest">', '<link rel="manifest" href="./manifest.webmanifest">\n<link rel="icon" href="./icons/le-routard.svg" type="image/svg+xml">\n<link rel="apple-touch-icon" href="./icons/le-routard.svg">')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html
          git rm .github/workflows/update-pwa-brand.yml
          git commit -m "Finish Le Routard PWA branding"
          git push
