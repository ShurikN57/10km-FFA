name: Build D1 ranking filter ranks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-d1-ranking-filter-ranks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Build year ranks
        run: |
          cat > /tmp/year_ranks.sql <<'SQL'
          DROP TABLE IF EXISTS athlete_rank_year;
          CREATE TABLE athlete_rank_year (
            athlete_id INTEGER PRIMARY KEY,
            rank_year INTEGER NOT NULL,
            rank_sex_year INTEGER
          );
          INSERT INTO athlete_rank_year(athlete_id,rank_year,rank_sex_year)
          SELECT id,
                 RANK() OVER (PARTITION BY distance,birth_year ORDER BY pb_sec ASC),
                 CASE WHEN sex IN ('M','F') THEN RANK() OVER (PARTITION BY distance,sex,birth_year ORDER BY pb_sec ASC) END
          FROM athletes;
          CREATE INDEX idx_rank_year ON athlete_rank_year(rank_year,athlete_id);
          CREATE INDEX idx_rank_sex_year ON athlete_rank_year(rank_sex_year,athlete_id);
          CREATE INDEX IF NOT EXISTS idx_athletes_distance_year_pb ON athletes(distance,birth_year,pb_sec);
          CREATE INDEX IF NOT EXISTS idx_athletes_distance_sex_year_pb ON athletes(distance,sex,birth_year,pb_sec);
          SQL
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=/tmp/year_ranks.sql --config=cloudflare-prototype/wrangler.toml --yes

      - name: Build category ranks before September 2026
        run: |
          cat > /tmp/cat_before.sql <<'SQL'
          DROP TABLE IF EXISTS athlete_rank_cat_before;
          CREATE TABLE athlete_rank_cat_before (
            athlete_id INTEGER PRIMARY KEY,
            rank_category INTEGER
          );
          INSERT INTO athlete_rank_cat_before(athlete_id,rank_category)
          WITH base AS (
            SELECT id,distance,pb_sec,
              CASE
                WHEN birth_year BETWEEN 2009 AND 2010 THEN 'CA'
                WHEN birth_year BETWEEN 2007 AND 2008 THEN 'JU'
                WHEN birth_year BETWEEN 2004 AND 2006 THEN 'ES'
                WHEN birth_year BETWEEN 1992 AND 2003 THEN 'SE'
                WHEN birth_year BETWEEN 1987 AND 1991 THEN 'M0'
                WHEN birth_year BETWEEN 1982 AND 1986 THEN 'M1'
                WHEN birth_year BETWEEN 1977 AND 1981 THEN 'M2'
                WHEN birth_year BETWEEN 1972 AND 1976 THEN 'M3'
                WHEN birth_year BETWEEN 1967 AND 1971 THEN 'M4'
                WHEN birth_year BETWEEN 1962 AND 1966 THEN 'M5'
                WHEN birth_year BETWEEN 1957 AND 1961 THEN 'M6'
                WHEN birth_year BETWEEN 1952 AND 1956 THEN 'M7'
                WHEN birth_year BETWEEN 1947 AND 1951 THEN 'M8'
                WHEN birth_year BETWEEN 1942 AND 1946 THEN 'M9'
                WHEN birth_year <= 1941 THEN 'M10'
                ELSE NULL END AS category
            FROM athletes
          )
          SELECT id,
                 CASE WHEN category IS NOT NULL THEN RANK() OVER (PARTITION BY distance,category ORDER BY pb_sec ASC) END
          FROM base;
          CREATE INDEX idx_rank_cat_before ON athlete_rank_cat_before(rank_category,athlete_id);
          SQL
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=/tmp/cat_before.sql --config=cloudflare-prototype/wrangler.toml --yes

      - name: Build category ranks after September 2026
        run: |
          cat > /tmp/cat_after.sql <<'SQL'
          DROP TABLE IF EXISTS athlete_rank_cat_after;
          CREATE TABLE athlete_rank_cat_after (
            athlete_id INTEGER PRIMARY KEY,
            rank_category INTEGER
          );
          INSERT INTO athlete_rank_cat_after(athlete_id,rank_category)
          WITH base AS (
            SELECT id,distance,pb_sec,
              CASE
                WHEN birth_year BETWEEN 2010 AND 2011 THEN 'CA'
                WHEN birth_year BETWEEN 2008 AND 2009 THEN 'JU'
                WHEN birth_year BETWEEN 2005 AND 2007 THEN 'ES'
                WHEN birth_year BETWEEN 1993 AND 2004 THEN 'SE'
                WHEN birth_year BETWEEN 1988 AND 1992 THEN 'M0'
                WHEN birth_year BETWEEN 1983 AND 1987 THEN 'M1'
                WHEN birth_year BETWEEN 1978 AND 1982 THEN 'M2'
                WHEN birth_year BETWEEN 1973 AND 1977 THEN 'M3'
                WHEN birth_year BETWEEN 1968 AND 1972 THEN 'M4'
                WHEN birth_year BETWEEN 1963 AND 1967 THEN 'M5'
                WHEN birth_year BETWEEN 1958 AND 1962 THEN 'M6'
                WHEN birth_year BETWEEN 1953 AND 1957 THEN 'M7'
                WHEN birth_year BETWEEN 1948 AND 1952 THEN 'M8'
                WHEN birth_year BETWEEN 1943 AND 1947 THEN 'M9'
                WHEN birth_year <= 1942 THEN 'M10'
                ELSE NULL END AS category
            FROM athletes
          )
          SELECT id,
                 CASE WHEN category IS NOT NULL THEN RANK() OVER (PARTITION BY distance,category ORDER BY pb_sec ASC) END
          FROM base;
          CREATE INDEX idx_rank_cat_after ON athlete_rank_cat_after(rank_category,athlete_id);
          CREATE INDEX IF NOT EXISTS idx_athletes_distance_pb ON athletes(distance,pb_sec);
          CREATE INDEX IF NOT EXISTS idx_athletes_distance_sex_pb ON athletes(distance,sex,pb_sec);
          SQL
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=/tmp/cat_after.sql --config=cloudflare-prototype/wrangler.toml --yes

      - name: Verify ranking filter ranks
        run: |
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT (SELECT COUNT(*) FROM athlete_rank_year) AS year_rows,(SELECT COUNT(*) FROM athlete_rank_cat_before) AS before_rows,(SELECT COUNT(*) FROM athlete_rank_cat_after) AS after_rows;" --config=cloudflare-prototype/wrangler.toml --yes
