name: Patch four FFA distances

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-four-distances.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile interface
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('mobile.html')
          s=p.read_text(encoding='utf-8')

          old='''  <div class="distance-switch" role="group" aria-label="Distance FFA">\n    <button type="button" class="distance-btn" data-distance="5k">5 km</button>\n    <button type="button" class="distance-btn active" data-distance="10k">10 km</button>\n  </div>'''
          new='''  <div class="distance-switch" role="group" aria-label="Distance FFA">\n    <button type="button" class="distance-btn" data-distance="5k">5 km</button>\n    <button type="button" class="distance-btn active" data-distance="10k">10 km</button>\n    <button type="button" class="distance-btn" data-distance="semi">Semi</button>\n    <button type="button" class="distance-btn" data-distance="marathon">Marathon</button>\n  </div>'''
          if s.count(old)!=1:
              raise SystemExit(f'distance switch pattern count={s.count(old)}')
          s=s.replace(old,new,1)

          old='''const FFA_DISTANCES={\n  "5k":{label:"5 km",file:"./ffa_5km_2024_2026.json.gz",export:"comparaison_ffa_5km.csv",minPb:"PB min, ex 15:00",maxPb:"PB max, ex 20:00"},\n  "10k":{label:"10 km",file:"./ffa_base.json.gz",export:"comparaison_ffa_10km.csv",minPb:"PB min, ex 30:00",maxPb:"PB max, ex 35:00"}\n};'''
          new='''const FFA_DISTANCES={\n  "5k":{label:"5 km",file:"./ffa_5km_2024_2026.json.gz",export:"comparaison_ffa_5km.csv",minPb:"PB min, ex 15:00",maxPb:"PB max, ex 20:00"},\n  "10k":{label:"10 km",file:"./ffa_base.json.gz",export:"comparaison_ffa_10km.csv",minPb:"PB min, ex 30:00",maxPb:"PB max, ex 35:00"},\n  "semi":{label:"Semi-marathon",file:"./ffa_semi_2024_2026.json.gz",export:"comparaison_ffa_semi.csv",minPb:"PB min, ex 1:05:00",maxPb:"PB max, ex 1:30:00"},\n  "marathon":{label:"Marathon",file:"./ffa_marathon_2024_2026.json.gz",export:"comparaison_ffa_marathon.csv",minPb:"PB min, ex 2:15:00",maxPb:"PB max, ex 3:30:00"}\n};'''
          if s.count(old)!=1:
              raise SystemExit(f'FFA_DISTANCES pattern count={s.count(old)}')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Fix category cutoff timezone
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('cloudflare-prototype/worker.js')
          s=p.read_text(encoding='utf-8')
          old="new Date() >= new Date('2026-09-01T00:00:00Z')"
          new="new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()) >= '2026-09-01'"
          n=s.count(old)
          if n!=4:
              raise SystemExit(f'expected 4 UTC cutoff occurrences, found {n}')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('mobile.html').read_text(encoding='utf-8')
          start=s.index('<script>')+len('<script>')
          end=s.rindex('</script>')
          Path('/tmp/mobile-inline.js').write_text(s[start:end],encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
          node --check cloudflare-prototype/worker.js
          git diff --check
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile.html cloudflare-prototype/worker.js
          git commit -m "Add semi and marathon interface"
          git push
