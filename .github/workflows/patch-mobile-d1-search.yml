name: Patch mobile search to D1 API

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-mobile-d1-search.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile.html
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('mobile.html')
          s=p.read_text(encoding='utf-8')

          old='const $ = id => document.getElementById(id);\n\nconst FFA_DISTANCES={'
          new='''const $ = id => document.getElementById(id);\nconst FFA_API="https://ffa-comparateur-api.57compte2.workers.dev";\nlet ffaApiSearchToken=0;\nlet ffaLoadedDistance=null;\nlet ffaLoadPromise=null;\nlet ffaLoadingDistance=null;\n\nconst FFA_DISTANCES={'''
          assert old in s
          s=s.replace(old,new,1)

          old='''  if(tab==="classement" && ffaReady && typeof renderFullFfaRanking==="function") renderFullFfaRanking(false);\n  if(tab==="recherche" && ffaReady && typeof renderFfaAthleteSearch==="function") renderFfaAthleteSearch();'''
          new='''  if(tab==="classement"){\n    if(ffaReady && ffaLoadedDistance===currentDistance && typeof renderFullFfaRanking==="function") renderFullFfaRanking(false);\n    else {\n      const m=$("ffaFullMsg"); if(m) m.textContent="Chargement du classement FFA…";\n      ensureFfaLoaded().then(()=>{ if(activeAppTab==="classement" && ffaReady) renderFullFfaRanking(false); });\n    }\n  }\n  if(tab==="recherche" && typeof renderFfaAthleteSearch==="function") renderFfaAthleteSearch();\n  if(tab==="analyse" && (!ffaReady || ffaLoadedDistance!==currentDistance)) ensureFfaLoaded();'''
          assert old in s
          s=s.replace(old,new,1)

          pattern=r'function renderFfaAthleteSearch\(\)\{.*?\n\}\ndocument\.querySelectorAll\("\.ffaRankModeBtn"\)'
          replacement='''async function renderFfaAthleteSearch(){\n  const input=$("ffaAthleteSearch"), box=$("ffaAthleteSearchResults"), msg=$("ffaAthleteSearchMsg");\n  if(!input||!box||!msg) return;\n  const raw=String(input.value||"").trim();\n  const q=norm(raw);\n  const token=++ffaApiSearchToken;\n  box.innerHTML=""; box.style.display="none";\n  if(!q){ msg.textContent=""; return; }\n  if(q.length<3){ msg.textContent="Saisis au moins 3 caractères."; return; }\n  msg.textContent="Recherche…";\n  try{\n    const params=new URLSearchParams({distance:currentDistance,q:raw,mode:ffaRankMode});\n    const r=await fetch(FFA_API+"/search?"+params.toString(),{cache:"no-store"});\n    if(!r.ok) throw new Error("HTTP "+r.status);\n    const data=await r.json();\n    if(token!==ffaApiSearchToken) return;\n    const found=(Array.isArray(data.rows)?data.rows:[]).map(r=>({\n      full_name:r.full_name||"",\n      annee_naissance:r.birth_year||"",\n      sexe:r.sex||"",\n      pb_sec:Number(r.pb_sec),\n      pb_chrono:Number.isFinite(Number(r.pb_sec))?chronoFromSec(Number(r.pb_sec)):"",\n      pb_course:r.pb_course||"",\n      pb_date:r.pb_date||"",\n      club:r.club||"",\n      athlete_ffa_id:r.athlete_ffa_id||"",\n      rank:Number(r.rank)||0,\n      category:r.category||""\n    }));\n    if(!found.length){ msg.textContent="Aucun athlète trouvé."; return; }\n    msg.textContent=found.length+(found.length===100?"+":"")+" profil"+(found.length>1?"s":"")+" trouvé"+(found.length>1?"s":"")+".";\n    box.style.display="block";\n    box.innerHTML=found.map(p=>{\n      const url=getFfaProfileUrl(p);\n      const name=esc(p.full_name||"");\n      const cat=p.category||currentFfaCategory(p);\n      const rank=p.rank;\n      const rankText=rank ? (rank===1 ? "1er" : Number(rank).toLocaleString("fr-FR")+"e") : "";\n      const metaParts=[];\n      metaParts.push(esc(p.annee_naissance||"année inconnue"));\n      if(p.sexe) metaParts.push(esc(p.sexe));\n      if(ffaRankMode==="category" && cat) metaParts.push(`<span style="color:var(--accent);font-weight:700">${esc(cat)}</span>`);\n      if(p.pb_chrono) metaParts.push(esc(p.pb_chrono));\n      if(rankText) metaParts.push(`<span style="color:var(--accent);font-weight:700">${esc(rankText)}</span>`);\n      const meta=metaParts.join(" · ");\n      const action=url\n        ? `<a href="${esc(url)}" target="_blank" rel="noopener" style="color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap">Fiche FFA ↗</a>`\n        : `<span class="small" style="white-space:nowrap">Pas de fiche FFA</span>`;\n      return `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 11px;border-bottom:1px solid var(--line)"><div style="min-width:0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${name}</div><div class="small">${meta}</div></div>${action}</div>`;\n    }).join("");\n  }catch(err){\n    if(token!==ffaApiSearchToken) return;\n    msg.textContent="Recherche FFA indisponible. Réessaie dans quelques secondes.";\n  }\n}\ndocument.querySelectorAll(".ffaRankModeBtn")'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          assert n==1, n

          s=s.replace('''    ffaReady=true;\n    $("baseStatus").textContent="Base FFA "+FFA_DISTANCES[distance].label+" · "+ffa.length.toLocaleString("fr-FR")+" profils";''','''    ffaReady=true;\n    ffaLoadedDistance=distance;\n    $("baseStatus").textContent="Base FFA "+FFA_DISTANCES[distance].label+" · "+ffa.length.toLocaleString("fr-FR")+" profils";''',1)
          s=s.replace('''    ffaReady=false;\n    $("baseStatus").textContent="Erreur de chargement de la base FFA "+FFA_DISTANCES[distance].label+" : "+(err&&err.message?err.message:err);''','''    ffaReady=false;\n    ffaLoadedDistance=null;\n    $("baseStatus").textContent="Erreur de chargement de la base FFA "+FFA_DISTANCES[distance].label+" : "+(err&&err.message?err.message:err);''',1)

          marker='''}\ndocument.querySelectorAll("[data-distance]").forEach(btn=>btn.addEventListener("click",()=>{'''
          insert='''}\nfunction ensureFfaLoaded(){\n  if(ffaReady && ffaLoadedDistance===currentDistance) return Promise.resolve();\n  if(ffaLoadPromise && ffaLoadingDistance===currentDistance) return ffaLoadPromise;\n  const distance=currentDistance;\n  ffaLoadingDistance=distance;\n  ffaLoadPromise=loadFfaDistance(distance).finally(()=>{\n    if(ffaLoadingDistance===distance){ ffaLoadPromise=null; ffaLoadingDistance=null; }\n  });\n  return ffaLoadPromise;\n}\ndocument.querySelectorAll("[data-distance]").forEach(btn=>btn.addEventListener("click",()=>{'''
          assert marker in s
          s=s.replace(marker,insert,1)

          pattern=r'document\.querySelectorAll\("\[data-distance\]"\)\.forEach\(btn=>btn\.addEventListener\("click",\(\)=>\{.*?\n\}\)\);\nrestoreDistanceReloadUi\(\);\nupdateDistanceUi\(\);\nloadFfaDistance\(currentDistance\);'
          replacement='''document.querySelectorAll("[data-distance]").forEach(btn=>btn.addEventListener("click",()=>{\n  const d=btn.getAttribute("data-distance");\n  if(d===currentDistance || !FFA_DISTANCES[d]) return;\n  const localBaseInMemory=ffaReady || !!ffaLoadPromise;\n  if(activeAppTab==="recherche" && !localBaseInMemory){\n    currentDistance=d;\n    try{ localStorage.setItem("comparateur_ffa_distance",d); }catch(e){}\n    updateDistanceUi();\n    refreshRestoreButton();\n    renderFfaAthleteSearch();\n    return;\n  }\n  // Si une grosse base locale a été chargée pour Classement/Analyse,\n  // un rechargement garantit sa libération complète par Safari/iOS.\n  saveDistanceReloadUi();\n  try{ localStorage.setItem("comparateur_ffa_distance",d); }catch(e){}\n  location.reload();\n}));\nrestoreDistanceReloadUi();\nupdateDistanceUi();\nif(activeAppTab==="classement" || activeAppTab==="analyse") ensureFfaLoaded();\nelse renderFfaAthleteSearch();'''
          s,n=re.subn(pattern,replacement,s,count=1,flags=re.S)
          assert n==1, n

          s=s.replace('''  if(ffaReady) runPasteAnalysis(); else pendingAutoParse=true;''','''  if(ffaReady) runPasteAnalysis(); else { pendingAutoParse=true; ensureFfaLoaded(); }''',1)
          s=s.replace('''    if(ffaReady) runPasteAnalysis(); else pendingAutoParse=true;''','''    if(ffaReady) runPasteAnalysis(); else { pendingAutoParse=true; ensureFfaLoaded(); }''',1)
          s=s.replace('''    if(ffaReady) runPasteAnalysis(); else pendingAutoParse=true;''','''    if(ffaReady) runPasteAnalysis(); else { pendingAutoParse=true; ensureFfaLoaded(); }''',1)
          s=s.replace('''      if(ffaReady && parsed.length) compute();''','''      if(ffaReady && parsed.length) compute();\n      else if(parsed.length){ pendingAutoParse=true; ensureFfaLoaded(); }''',1)
          s=s.replace("navigator.serviceWorker.register('./sw.js?v=20260831e')","navigator.serviceWorker.register('./sw.js?v=20260831f')",1)

          assert 'const FFA_API="https://ffa-comparateur-api.57compte2.workers.dev";' in s
          assert 'loadFfaDistance(currentDistance);' not in s
          assert 'async function renderFfaAthleteSearch()' in s
          assert 'function ensureFfaLoaded()' in s
          p.write_text(s,encoding='utf-8')
      - name: Validate JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('mobile.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script>(.*?)</script>',s,re.S)
          assert blocks
          Path('/tmp/mobile-inline.js').write_text(blocks[-1],encoding='utf-8')
          PY
          node --check /tmp/mobile-inline.js
          git diff --check
      - name: Commit mobile change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html
          git commit -m "Use D1 API for athlete search"
          git push
