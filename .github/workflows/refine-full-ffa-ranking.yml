name: Refine full FFA ranking
on:
  push:
    paths:
      - '.github/workflows/refine-full-ffa-ranking.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/refine_full_ffa_ranking.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Refine full FFA ranking filters and layout"
          git push
