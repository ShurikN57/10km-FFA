name: Polish spacing selects blues
on:
  push:
    paths:
      - '.github/workflows/polish-spacing-selects-blues.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: python .github/scripts/polish_spacing_selects_blues.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Polish bottom spacing, selects and blue accents"
          git push
