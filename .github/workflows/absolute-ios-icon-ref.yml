name: Absolute iOS icon ref

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/absolute-ios-icon-ref.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use absolute Apple icon URL everywhere
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          url='https://shurikn57.github.io/10km-FFA/apple-touch-icon.png'
          for name in ['index.html','mobile.html']:
              p=Path(name)
              s=p.read_text()
              s=re.sub(r'<link rel="apple-touch-icon"[^>]*>', f'<link rel="apple-touch-icon" sizes="180x180" href="{url}">', s)
              s=re.sub(r'<link rel="apple-touch-icon-precomposed"[^>]*>', f'<link rel="apple-touch-icon-precomposed" sizes="180x180" href="{url}">', s)
              p.write_text(s)
          PY
          grep -n "apple-touch-icon" index.html mobile.html
      - name: Commit and self-remove
        run: |
          rm -f .github/workflows/absolute-ios-icon-ref.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html mobile.html .github/workflows/absolute-ios-icon-ref.yml
          git commit -m "Use absolute iOS icon reference"
          git push
