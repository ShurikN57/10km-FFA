name: Fix FFA athlete search

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-ffa-athlete-search.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair injected JavaScript
        shell: python
        run: |
          from pathlib import Path
          for fn in ['mobile.html','app base.html']:
              p=Path(fn)
              text=p.read_text(encoding='utf-8')
              start=text.find('\\nlet ffaAthleteSearchTimer=null;')
              end=text.find('function sortRows(rows)', start)
              if start < 0 or end < 0:
                  raise SystemExit(f'Bloc recherche introuvable dans {fn}')
              block=text[start:end]
              block=block.replace('\\n','\n')
              text=text[:start]+block+text[end:]
              p.write_text(text,encoding='utf-8')
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile.html "app base.html"
          git commit -m "Fix FFA athlete search script"
          git push
