name: Import FFA data into D1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate D1 import SQL under statement limit
        shell: python
        run: |
          import gzip, json, re, unicodedata
          from pathlib import Path

          ROOT = Path.cwd()
          OUT = ROOT / 'd1-import.sql'
          SOURCES = [
              ('5k', ROOT / 'ffa_5km_2024_2026.json.gz'),
              ('10k', ROOT / 'ffa_base.json.gz'),
          ]
          MAX_STMT = 95000
          PREFIX = 'INSERT INTO athletes(distance,full_name,name_key,birth_year,sex,pb_sec,pb_course,pb_date,club,athlete_ffa_id) VALUES\n'

          def name_key(value):
              s = unicodedata.normalize('NFD', str(value or ''))
              s = ''.join(c for c in s if unicodedata.category(c) != 'Mn').upper()
              s = re.sub(r'[^A-Z0-9]+', ' ', s)
              return re.sub(r'\s+', ' ', s).strip()

          def sql(v):
              if v is None or v == '': return 'NULL'
              if isinstance(v, (int, float)): return str(int(v))
              return "'" + str(v).replace("'", "''") + "'"

          def rows_from(path):
              with gzip.open(path, 'rt', encoding='utf-8') as f:
                  data = json.load(f)
              return data if isinstance(data, list) else data.get('rows', [])

          counts = {'5k': 0, '10k': 0}
          statements = 0
          max_seen = 0
          current = []

          def flush(out):
              global statements, max_seen, current
              if not current: return
              stmt = PREFIX + ',\n'.join(current) + ';\n'
              size = len(stmt.encode('utf-8'))
              if size > 100000:
                  raise SystemExit(f'SQL statement too large: {size} bytes')
              max_seen = max(max_seen, size)
              out.write(stmt)
              statements += 1
              current = []

          with OUT.open('w', encoding='utf-8', newline='\n') as out:
              out.write('DELETE FROM athletes;\n')
              for distance, path in SOURCES:
                  if not path.exists(): raise SystemExit(f'Missing source: {path}')
                  for r in rows_from(path):
                      if not isinstance(r, list) or len(r) < 8: continue
                      pb = int(r[3] or 0)
                      if pb <= 0: continue
                      if distance == '5k' and pb < 720: continue
                      vals = [distance, r[0], name_key(r[0]), r[1], r[2], pb, r[4], r[5], r[6], r[7]]
                      row = '(' + ','.join(sql(v) for v in vals) + ')'
                      candidate = PREFIX + ',\n'.join(current + [row]) + ';\n'
                      if current and len(candidate.encode('utf-8')) > MAX_STMT:
                          flush(out)
                      current.append(row)
                      counts[distance] += 1
              flush(out)

          print(f"5k={counts['5k']}")
          print(f"10k={counts['10k']}")
          print(f"total={counts['5k']+counts['10k']}")
          print(f"statements={statements}")
          print(f"max_statement_bytes={max_seen}")
          print(f"file_bytes={OUT.stat().st_size}")
          if counts != {'5k': 123248, '10k': 527474}:
              raise SystemExit(f'Unexpected counts: {counts}')

      - name: Import into remote D1
        run: npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=d1-import.sql --config=cloudflare-prototype/wrangler.toml --yes

      - name: Verify remote counts
        run: npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT distance, COUNT(*) AS n FROM athletes GROUP BY distance ORDER BY distance;" --config=cloudflare-prototype/wrangler.toml --yes
