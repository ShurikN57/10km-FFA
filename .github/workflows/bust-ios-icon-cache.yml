name: Bust iOS PWA icon cache

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bust-ios-icon-cache.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create cache-busted icon filenames
        run: |
          cp icons/apple-touch-icon.png icons/apple-touch-icon-routard-v3.png
          cp icons/icon-192x192.png icons/icon-192x192-routard-v3.png
          cp icons/icon-512x512.png icons/icon-512x512-routard-v3.png
          cp icons/favicon-32x32.png icons/favicon-32x32-routard-v3.png
      - name: Update PWA references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('./icons/favicon-32x32.png','./icons/favicon-32x32-routard-v3.png')
          s=s.replace('./icons/apple-touch-icon.png','./icons/apple-touch-icon-routard-v3.png')
          p.write_text(s,encoding='utf-8')

          Path('manifest.webmanifest').write_text('''{
            "name": "Le Routard",
            "short_name": "Le Routard",
            "start_url": "./mobile.html?v=3",
            "display": "standalone",
            "background_color": "#0f1115",
            "theme_color": "#0f1115",
            "lang": "fr",
            "icons": [
              {"src":"./icons/icon-192x192-routard-v3.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"./icons/icon-512x512-routard-v3.png","sizes":"512x512","type":"image/png","purpose":"any"}
            ]
          }
          ''',encoding='utf-8')
          PY
      - name: Commit and cleanup temporary workflow
        run: |
          rm -f .github/workflows/bust-ios-icon-cache.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Bust iOS cache for Le Routard icon'
          git push
