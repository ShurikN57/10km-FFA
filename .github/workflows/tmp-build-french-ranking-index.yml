name: Build D1 French ranking index

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-build-french-ranking-index.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build French ranking lookup
        shell: bash
        run: |
          cat > /tmp/french_ranking.sql <<'SQL'
          DROP TABLE IF EXISTS athlete_french_rank;
          CREATE TABLE athlete_french_rank (
            athlete_id INTEGER PRIMARY KEY,
            distance TEXT NOT NULL,
            rank_general INTEGER NOT NULL
          );

          INSERT INTO athlete_french_rank(athlete_id,distance,rank_general)
          SELECT r.athlete_id,r.distance,r.rank
          FROM athlete_general_rank r
          JOIN athletes a ON a.id = r.athlete_id
          WHERE a.full_name NOT GLOB '* ([A-Z][A-Z][A-Z])';

          CREATE INDEX idx_french_rank_distance_rank
          ON athlete_french_rank(distance,rank_general,athlete_id);

          DROP TABLE IF EXISTS ffa_french_stats;
          CREATE TABLE ffa_french_stats (
            distance TEXT PRIMARY KEY,
            total INTEGER NOT NULL
          );

          INSERT INTO ffa_french_stats(distance,total)
          SELECT distance,COUNT(*)
          FROM athlete_french_rank
          GROUP BY distance;
          SQL
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=/tmp/french_ranking.sql --config=cloudflare-prototype/wrangler.toml --yes
      - name: Verify French ranking lookup
        shell: bash
        run: |
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT s.distance,s.total,COUNT(r.athlete_id) AS indexed FROM ffa_french_stats s LEFT JOIN athlete_french_rank r ON r.distance=s.distance GROUP BY s.distance,s.total ORDER BY s.distance;" --config=cloudflare-prototype/wrangler.toml --yes
