name: Temp UI filters fix
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-ui-filters-fix.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch files
        run: |
          python - <<'PY'
          from pathlib import Path

          # core.js: remove trailing double apostrophes from all chrono display helpers.
          p=Path('core.js')
          s=p.read_text(encoding='utf-8')
          s=s.replace('return h ? h+"h"+String(m).padStart(2,"0")+"\'"+String(ss).padStart(2,"0")+"\'\'"\n           : m+"\'"+String(ss).padStart(2,"0")+"\'\'";',
                      'return h ? h+"h"+String(m).padStart(2,"0")+"\'"+String(ss).padStart(2,"0")\n           : m+"\'"+String(ss).padStart(2,"0");')
          s=s.replace('return sign + (m ? m+"\'" : "") + String(s).padStart(2,"0")+"\'\'";',
                      'return sign + (m ? m+"\'" : "") + String(s).padStart(2,"0");')
          s=s.replace('return h ? `${h}h${String(m).padStart(2,"0")}\'${String(ss).padStart(2,"0")}\'\'`\n               : `${m}\'${String(ss).padStart(2,"0")}\'\'`;',
                      'return h ? `${h}h${String(m).padStart(2,"0")}\'${String(ss).padStart(2,"0)}`\n               : `${m}\'${String(ss).padStart(2,"0")}`;')
          # Safety correction for typo-free exact target when source contains normal code.
          s=s.replace('return h ? `${h}h${String(m).padStart(2,"0")}\'${String(ss).padStart(2,"0")}\'\'`\n               : `${m}\'${String(ss).padStart(2,"0")}\'\'`;',
                      'return h ? `${h}h${String(m).padStart(2,"0")}\'${String(ss).padStart(2,"0")}`\n               : `${m}\'${String(ss).padStart(2,"0")}`;')
          p.write_text(s,encoding='utf-8')

          # mobile.html
          p=Path('mobile.html')
          s=p.read_text(encoding='utf-8')

          css_anchor='#ffaAthleteSearchMsg:empty { display:none }\n#ffaFullMsg { font-size:11px; color:#7f8997; min-height:0 }'
          css_add='''#ffaAthleteSearchMsg:empty { display:none }\n#ffaFullMsg { font-size:11px; color:#7f8997; min-height:0 }\n.ffa-search-wrap{position:relative}\n.ffa-search-wrap #ffaAthleteSearch{padding-right:42px!important}\n.ffa-search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:30px;height:30px;min-height:30px;padding:0;border:0;background:transparent;color:#aeb6c2;font-size:24px;line-height:1;display:none;box-shadow:none}\n.ffa-search-clear.show{display:grid;place-items:center}\n.ffa-french-filter{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;margin:0 0 9px;padding:8px 11px;border:1px solid #343d4c;background:#1a1f28;border-radius:15px}\n.ffa-french-filter span{font-size:14px;font-weight:700;color:#d9dee7}\n.ffa-switch{position:relative;width:48px;height:28px;flex:0 0 48px}\n.ffa-switch input{position:absolute;opacity:0;pointer-events:none}\n.ffa-switch i{position:absolute;inset:0;border-radius:999px;background:#343b47;border:1px solid #46505f;transition:.18s}\n.ffa-switch i:before{content:\"\";position:absolute;width:22px;height:22px;left:2px;top:2px;border-radius:50%;background:#d4d8df;transition:.18s}\n.ffa-switch input:checked+i{background:#3178e8;border-color:#67a1ff}\n.ffa-switch input:checked+i:before{transform:translateX(20px);background:#fff}'''
          if css_anchor not in s: raise SystemExit('CSS anchor not found')
          s=s.replace(css_anchor,css_add,1)

          old='<input id="ffaAthleteSearch" type="search" placeholder="Nom et prénom..." autocomplete="off" style="width:100%;margin:0">'
          new='''<div class="ffa-search-wrap">\n          <input id="ffaAthleteSearch" type="search" placeholder="Nom et prénom..." autocomplete="off" style="width:100%;margin:0">\n          <button type="button" id="ffaAthleteSearchClear" class="ffa-search-clear" aria-label="Effacer la recherche">×</button>\n        </div>'''
          if old not in s: raise SystemExit('athlete search input anchor not found')
          s=s.replace(old,new,1)

          old='''        </div>\n        <button type="button" id="ffaFullReset" style="width:100%;margin-bottom:8px">Réinitialiser les filtres</button>'''
          new='''        </div>\n        <label class="ffa-french-filter" for="ffaFullFrench">\n          <span>Français uniquement</span>\n          <span class="ffa-switch"><input id="ffaFullFrench" type="checkbox"><i></i></span>\n        </label>\n        <button type="button" id="ffaFullReset" style="width:100%;margin-bottom:8px">Réinitialiser les filtres</button>'''
          if old not in s: raise SystemExit('ranking reset anchor not found')
          s=s.replace(old,new,1)

          old='''  const maxPb=parsePbLimit($("ffaFullMaxPb").value);\n  const params=new URLSearchParams({distance:currentDistance,page:String(ffaFullPage+1),sort:ffaFullSort,dir:ffaFullSortDir});'''
          new='''  const maxPb=parsePbLimit($("ffaFullMaxPb").value);\n  const french=!!($("ffaFullFrench")&&$("ffaFullFrench").checked);\n  const params=new URLSearchParams({distance:currentDistance,page:String(ffaFullPage+1),sort:ffaFullSort,dir:ffaFullSortDir});'''
          if old not in s: raise SystemExit('ranking params anchor not found')
          s=s.replace(old,new,1)

          old='''  if(cat) params.set("category",cat);'''
          new='''  if(cat) params.set("category",cat);\n  if(french) params.set("french","1");'''
          if old not in s: raise SystemExit('category params anchor not found')
          s=s.replace(old,new,1)

          old='''["ffaFullSex","ffaFullCategory"].forEach(id=>{\n  const el=$(id); if(el) el.addEventListener("change",()=>renderFullFfaRanking(true));\n});'''
          new='''["ffaFullSex","ffaFullCategory","ffaFullFrench"].forEach(id=>{\n  const el=$(id); if(el) el.addEventListener("change",()=>renderFullFfaRanking(true));\n});'''
          if old not in s: raise SystemExit('ranking listener anchor not found')
          s=s.replace(old,new,1)

          old='''  $("ffaFullMaxPb").value="";\n  ffaFullSort='rank';'''
          new='''  $("ffaFullMaxPb").value="";\n  if($("ffaFullFrench")) $("ffaFullFrench").checked=false;\n  ffaFullSort='rank';'''
          if old not in s: raise SystemExit('reset values anchor not found')
          s=s.replace(old,new,1)

          old='''if(_ffaAthleteSearch){\n  _ffaAthleteSearch.addEventListener("input",()=>{\n    clearTimeout(ffaAthleteSearchTimer);\n    ffaAthleteSearchTimer=setTimeout(renderFfaAthleteSearch,220);\n  });\n}'''
          new='''if(_ffaAthleteSearch){\n  const clearBtn=$("ffaAthleteSearchClear");\n  const syncClear=()=>{ if(clearBtn) clearBtn.classList.toggle("show",!!_ffaAthleteSearch.value); };\n  _ffaAthleteSearch.addEventListener("input",()=>{\n    syncClear();\n    clearTimeout(ffaAthleteSearchTimer);\n    ffaAthleteSearchTimer=setTimeout(renderFfaAthleteSearch,220);\n  });\n  if(clearBtn) clearBtn.addEventListener("click",()=>{\n    clearTimeout(ffaAthleteSearchTimer);\n    _ffaAthleteSearch.value="";\n    syncClear();\n    const box=$("ffaAthleteSearchResults"), msg=$("ffaAthleteSearchMsg");\n    if(box){ box.innerHTML=""; box.style.display="none"; }\n    if(msg) msg.textContent="";\n    _ffaAthleteSearch.focus();\n  });\n  syncClear();\n}'''
          if old not in s: raise SystemExit('athlete listener anchor not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')

          # worker.js: French-only ranking filter. Foreign athletes in FFA source carry trailing country code '(XXX)'.
          p=Path('cloudflare-prototype/worker.js')
          s=p.read_text(encoding='utf-8')
          old="""      const q = normalizeName(url.searchParams.get('q'));\n      const ftsQuery = q.length >= 3 ? ftsQueryFromName(q) : '';"""
          new="""      const q = normalizeName(url.searchParams.get('q'));\n      const frenchOnly = url.searchParams.get('french') === '1';\n      const ftsQuery = q.length >= 3 ? ftsQueryFromName(q) : '';"""
          if old not in s: raise SystemExit('worker q anchor not found')
          s=s.replace(old,new,1)

          old="""      const plainGeneral = !sex && !category && !year && !q &&\n        !(Number.isFinite(minPb) && minPb > 0) &&"""
          new="""      const plainGeneral = !sex && !category && !year && !q && !frenchOnly &&\n        !(Number.isFinite(minPb) && minPb > 0) &&"""
          if old not in s: raise SystemExit('worker plainGeneral anchor not found')
          s=s.replace(old,new,1)

          old="""      const where = ['a.distance = ?'];\n      const binds = [distance];"""
          new="""      const where = ['a.distance = ?'];\n      const binds = [distance];\n      if (frenchOnly) where.push(\"a.full_name NOT GLOB '* ([A-Z][A-Z][A-Z])'\");"""
          if old not in s: raise SystemExit('worker where anchor not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate JavaScript
        run: |
          node --check core.js
          node --check cloudflare-prototype/worker.js
          python - <<'PY'
          from pathlib import Path
          s=Path('mobile.html').read_text(encoding='utf-8')
          assert 'id="ffaFullFrench"' in s
          assert 'id="ffaAthleteSearchClear"' in s
          assert 'params.set("french","1")' in s
          assert 'grid-template-columns:repeat(2,1fr)!important' in s
          print('mobile.html checks OK')
          PY
      - name: Commit changes and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-ui-filters-fix.yml
          git add mobile.html core.js cloudflare-prototype/worker.js .github/workflows/tmp-ui-filters-fix.yml
          git commit -m "Refine chrono and FFA filters"
          git push
