name: Resume validated V3 FFA D1 staging import

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-import-v3-d1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffa-d1-import
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify completed staging data
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT SUM(distance='5k') AS n5,SUM(distance='10k') AS n10,SUM(distance='semi') AS ns,SUM(distance='marathon') AS nm,COUNT(*) AS total FROM athletes_next;" --config=cloudflare-prototype/wrangler.toml --yes --json)
          echo "$result" | jq '.[0].results[0]'
          echo "$result" | jq -e '.[0].results[0] | .n5==124626 and .n10==533085 and .ns==490879 and .nm==288475 and .total==1437065'
          derived=$(npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT (SELECT COUNT(*) FROM athlete_general_rank_next) AS general_count,(SELECT COUNT(*) FROM athlete_search_rank_next) AS search_count,(SELECT COUNT(*) FROM athlete_rank_year_next) AS year_count,(SELECT COUNT(*) FROM athlete_fts_next) AS fts_count;" --config=cloudflare-prototype/wrangler.toml --yes --json)
          echo "$derived" | jq '.[0].results[0]'
          echo "$derived" | jq -e '.[0].results[0] | .general_count==1437065 and .search_count==1437065 and .year_count==1437065 and .fts_count==1437065'

      - name: Create final indexes one at a time
        shell: bash
        run: |
          set -euo pipefail
          indexes=(
            "CREATE INDEX IF NOT EXISTS idx_general_rank_next_distance_rank ON athlete_general_rank_next(distance,rank,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_general_rank_next_distance_display ON athlete_general_rank_next(distance,display_order,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_search_rank_next_general ON athlete_search_rank_next(rank_general,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_search_rank_next_sex ON athlete_search_rank_next(rank_sex,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_search_rank_next_cat_before ON athlete_search_rank_next(rank_cat_before_sep,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_search_rank_next_cat_after ON athlete_search_rank_next(rank_cat_after_sep,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_rank_year_next_year ON athlete_rank_year_next(rank_year,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_rank_year_next_sex_year ON athlete_rank_year_next(rank_sex_year,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_rank_cat_before_next ON athlete_rank_cat_before_next(rank_category,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_rank_cat_after_next ON athlete_rank_cat_after_next(rank_category,athlete_id)"
            "CREATE INDEX IF NOT EXISTS idx_french_rank_next_distance_rank ON athlete_french_rank_next(distance,rank_general,athlete_id)"
          )
          current=0
          for sql in "${indexes[@]}"; do
            current=$((current+1))
            echo "Index $current/${#indexes[@]}"
            npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="$sql" --config=cloudflare-prototype/wrangler.toml --yes
          done

      - name: Build staging statistics
        shell: bash
        run: |
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="INSERT INTO ffa_distance_stats_next(distance,total) SELECT distance,COUNT(*) FROM athletes_next GROUP BY distance;" --config=cloudflare-prototype/wrangler.toml --yes
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="INSERT INTO ffa_french_stats_next(distance,total) SELECT distance,COUNT(*) FROM athlete_french_rank_next GROUP BY distance;" --config=cloudflare-prototype/wrangler.toml --yes

      - name: Verify staging immediately before swap
        shell: bash
        run: |
          set -euo pipefail
          stats=$(npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT SUM(total) AS total FROM ffa_distance_stats_next;" --config=cloudflare-prototype/wrangler.toml --yes --json)
          echo "$stats" | jq '.[0].results[0]'
          echo "$stats" | jq -e '.[0].results[0].total==1437065'

      - name: Atomically switch production table names
        shell: bash
        run: |
          cat > /tmp/ffa_v3_swap.sql <<'SQL'
          ALTER TABLE athlete_fts RENAME TO athlete_fts_old;
          ALTER TABLE athlete_french_rank RENAME TO athlete_french_rank_old;
          ALTER TABLE ffa_french_stats RENAME TO ffa_french_stats_old;
          ALTER TABLE athlete_general_rank RENAME TO athlete_general_rank_old;
          ALTER TABLE athlete_search_rank RENAME TO athlete_search_rank_old;
          ALTER TABLE athlete_rank_year RENAME TO athlete_rank_year_old;
          ALTER TABLE athlete_rank_cat_before RENAME TO athlete_rank_cat_before_old;
          ALTER TABLE athlete_rank_cat_after RENAME TO athlete_rank_cat_after_old;
          ALTER TABLE ffa_distance_stats RENAME TO ffa_distance_stats_old;
          ALTER TABLE athletes RENAME TO athletes_old;

          ALTER TABLE athletes_next RENAME TO athletes;
          ALTER TABLE athlete_general_rank_next RENAME TO athlete_general_rank;
          ALTER TABLE athlete_search_rank_next RENAME TO athlete_search_rank;
          ALTER TABLE athlete_rank_year_next RENAME TO athlete_rank_year;
          ALTER TABLE athlete_rank_cat_before_next RENAME TO athlete_rank_cat_before;
          ALTER TABLE athlete_rank_cat_after_next RENAME TO athlete_rank_cat_after;
          ALTER TABLE athlete_french_rank_next RENAME TO athlete_french_rank;
          ALTER TABLE ffa_distance_stats_next RENAME TO ffa_distance_stats;
          ALTER TABLE ffa_french_stats_next RENAME TO ffa_french_stats;
          ALTER TABLE athlete_fts_next RENAME TO athlete_fts;
          SQL
          npx --yes wrangler@latest d1 execute ffa-comparateur --remote --file=/tmp/ffa_v3_swap.sql --config=cloudflare-prototype/wrangler.toml --yes

      - name: Verify production D1 and API
        shell: bash
        run: |
          set -euo pipefail
          result=$(npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="SELECT SUM(distance='5k') AS n5,SUM(distance='10k') AS n10,SUM(distance='semi') AS ns,SUM(distance='marathon') AS nm,COUNT(*) AS total FROM athletes;" --config=cloudflare-prototype/wrangler.toml --yes --json)
          echo "$result" | jq '.[0].results[0]'
          echo "$result" | jq -e '.[0].results[0] | .n5==124626 and .n10==533085 and .ns==490879 and .nm==288475 and .total==1437065'
          for distance in 5k 10k semi marathon; do
            payload=$(curl -fsS "https://ffa-comparateur-api.57compte2.workers.dev/ranking?distance=$distance&page=1")
            echo "$payload" | jq -e '.rows | length > 0' >/dev/null
            echo "$distance: $(echo "$payload" | jq -r '.total') profils"
            french=$(curl -fsS "https://ffa-comparateur-api.57compte2.workers.dev/ranking?distance=$distance&french=1&page=1")
            echo "$french" | jq -e '.rows | length > 0' >/dev/null
          done
          search=$(curl -fsS 'https://ffa-comparateur-api.57compte2.workers.dev/search?distance=10k&q=FELLAH&mode=general')
          echo "$search" | jq -e '.rows | map(select(.athlete_ffa_id=="4221349")) | length==1' >/dev/null

      - name: Remove old production tables after successful verification
        shell: bash
        run: |
          set -euo pipefail
          old_tables=(
            athlete_fts_old athlete_french_rank_old ffa_french_stats_old
            athlete_general_rank_old athlete_search_rank_old athlete_rank_year_old
            athlete_rank_cat_before_old athlete_rank_cat_after_old
            ffa_distance_stats_old athletes_old
          )
          for table in "${old_tables[@]}"; do
            echo "Drop $table"
            npx --yes wrangler@latest d1 execute ffa-comparateur --remote --command="DROP TABLE $table" --config=cloudflare-prototype/wrangler.toml --yes
          done
