name: Fix Le Routard PWA icon

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-le-routard-icon.yml'
      - 'icons/le-routard-source.jpg'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick
      - name: Build PNG icons
        run: |
          mkdir -p icons
          convert icons/le-routard-source.jpg -resize 180x180 icons/apple-touch-icon.png
          convert icons/le-routard-source.jpg -resize 192x192 icons/icon-192x192.png
          convert icons/le-routard-source.jpg -resize 512x512 icons/icon-512x512.png
          convert icons/le-routard-source.jpg -resize 512x512 -gravity center -background '#0f1115' -extent 640x640 -resize 512x512 icons/icon-512x512-maskable.png
          convert icons/le-routard-source.jpg -resize 32x32 icons/favicon-32x32.png
      - name: Update manifest and mobile links
        run: |
          cat > manifest.webmanifest <<'EOF'
          {
            "name": "Le Routard",
            "short_name": "Le Routard",
            "start_url": "./mobile.html",
            "display": "standalone",
            "background_color": "#0f1115",
            "theme_color": "#0f1115",
            "lang": "fr",
            "icons": [
              {"src":"./icons/icon-192x192.png","sizes":"192x192","type":"image/png","purpose":"any"},
              {"src":"./icons/icon-512x512.png","sizes":"512x512","type":"image/png","purpose":"any"},
              {"src":"./icons/icon-512x512-maskable.png","sizes":"512x512","type":"image/png","purpose":"maskable"}
            ]
          }
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path('mobile.html')
          s=p.read_text()
          s=s.replace('<link rel="icon" href="./icons/le-routard.svg" type="image/svg+xml">','<link rel="icon" href="./icons/favicon-32x32.png" type="image/png">')
          s=s.replace('<link rel="apple-touch-icon" href="./icons/le-routard.svg">','<link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">')
          p.write_text(s)
          PY
      - name: Commit final icons and cleanup
        run: |
          rm -f icons/le-routard.svg icons/le-routard-source.jpg .github/workflows/fix-le-routard-icon.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Le Routard PWA icon for iOS'
          git push
